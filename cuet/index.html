<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Everything CUET</title>
  <meta name="description" content="Find your CUET colleges, track every form and deadline, and get help applying. Free, no login.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/logo.webp" type="image/webp">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-cap" viewBox="0 0 24 24"><path d="M2.5 9 12 4.5 21.5 9 12 13.5z"/><path d="M6.5 11v4.5c0 1.4 2.5 3 5.5 3s5.5-1.6 5.5-3V11M21.5 9v5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3.5 4.5h2l2.2 10.5h10.6l2-7.5H7"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4.5h5.5V10M19.5 4.5 11 13M17 14v4.5a1 1 0 0 1-1 1H5.5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1H10"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.1"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8.5A1.5 1.5 0 0 1 19 17h-8l-4.5 3.5V17H5a1.5 1.5 0 0 1-1.5-1.5V7A1.5 1.5 0 0 1 5 5.5z"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2c.8 5.2 4.8 9.2 10 10-5.2.8-9.2 4.8-10 10-.8-5.2-4.8-9.2-10-10 5.2-.8 9.2-4.8 10-10z" fill="currentColor" stroke="none"/></symbol>
</svg>

<a class="skip" href="#view">Skip to content</a>
<div class="app">
  <aside class="rail" aria-label="Main">
    <a class="rail-brand" href="#/" aria-label="Everything CUET home"><img src="assets/wordmark-red.png" alt="Everything CUET" width="720" height="325"></a>
    <nav class="tabs" id="tabs"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>

  <div class="main">
    <header class="bar" id="bar">
      <a class="bar-logo" href="#/" aria-label="Everything CUET home"><img src="assets/logo.webp" alt="" width="34" height="34"></a>
      <div class="bar-title" id="barTitle"></div>
      <div class="bar-act">
        <button class="pill" id="langBtn" type="button" aria-label="Switch language">हि</button>
        <a class="pill acct" id="acctBtn" href="#/login">Log in</a>
        <a class="icon-btn" id="cartBtn" href="#/pricing?cart=1" aria-label="Cart" hidden><svg class="i"><use href="#i-cart"/></svg><b id="cartCount">0</b></a>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<button class="bot-fab" id="botFab" type="button" aria-label="Ask the admission assistant"><svg class="i"><use href="#i-chat"/></svg></button>
<section class="bot" id="bot" hidden aria-label="Admission assistant">
  <header><b data-t="bot.title">Admission assistant</b><button class="icon-btn ghost" type="button" data-act="bot-close" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></header>
  <div class="bot-log" id="botLog"></div>
  <form class="bot-form" id="botForm"><input id="botIn" autocomplete="off" placeholder="Ask about colleges, forms, dates…"><button class="btn pri" type="submit" aria-label="Send"><svg class="i"><use href="#i-right"/></svg></button></form>
</section>

<dialog class="sheet" id="modal"><div class="sheet-grip" aria-hidden="true"></div><div id="modalBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
