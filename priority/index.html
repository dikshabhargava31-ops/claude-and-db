<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IPA Ops Board</title>
<meta name="description" content="IPA operations: today's work, the team and their KRAs, tasks, routines, the weekly meeting and expenses.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#ffffff; --panel:#f7f7f5; --sunk:#efefec; --line:#e6e5e1; --hover:#f3f3f0;
  --ink:#1f1f1d; --muted:#6b6a65; --faint:#8f8e88;
  --accent:#1f3a5f; --accent-ink:#ffffff; --accent-soft:#e3eaf3;
  --crit:#b42318; --crit-soft:#fde2e1; --warn:#93370d; --warn-soft:#fef0c7;
  --ok:#067647; --ok-soft:#dcfae6; --info:#1d3f8c; --info-soft:#e0eaff; --vio:#6941c6; --vio-soft:#f4ebff;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191919; --panel:#202020; --sunk:#2a2a2a; --line:#333331; --hover:#262626;
  --ink:#ebebe8; --muted:#a3a29c; --faint:#85847e;
  --accent:#8fb0dc; --accent-ink:#10161f; --accent-soft:#1f2a3a;
  --crit:#f0786d; --crit-soft:#3d1f1d; --warn:#e8b94a; --warn-soft:#382d12;
  --ok:#6cc893; --ok-soft:#183126; --info:#8ea8f0; --info-soft:#1e2640; --vio:#b9a2f0; --vio-soft:#2c2340; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191919; --panel:#202020; --sunk:#2a2a2a; --line:#333331; --hover:#262626;
  --ink:#ebebe8; --muted:#a3a29c; --faint:#85847e;
  --accent:#8fb0dc; --accent-ink:#10161f; --accent-soft:#1f2a3a;
  --crit:#f0786d; --crit-soft:#3d1f1d; --warn:#e8b94a; --warn-soft:#382d12;
  --ok:#6cc893; --ok-soft:#183126; --info:#8ea8f0; --info-soft:#1e2640; --vio:#b9a2f0; --vio-soft:#2c2340; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.2;margin:0}
h1{font-size:22px}h2{font-size:19px}h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;margin-right:auto}
.sync{font-size:12px;color:var(--muted)}
nav.tabs{max-width:1120px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:500}
nav.tabs a.on{color:var(--ink);border-color:var(--accent)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 14px}
.sub{color:var(--muted);font-size:13px}
.grid{display:grid;gap:14px}
@media (min-width:860px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{margin-bottom:8px;display:flex;align-items:center;gap:8px}
.count{font:600 12px var(--f-body);color:var(--muted);background:var(--sunk);border-radius:99px;padding:1px 8px}
.row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{word-wrap:break-word}
.meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.chip{font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 8px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.vio{background:var(--vio-soft);color:var(--vio)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:3px 9px;font-size:13px}
.btn.link{border:0;background:none;color:var(--accent);padding:0;font-size:13px}
.form{display:grid;gap:8px;grid-template-columns:1fr}
@media (min-width:700px){.form.inline{grid-template-columns:minmax(0,2.4fr) repeat(3,minmax(0,1fr)) auto}}
input[type=text],input[type=date],input[type=number],input[type=tel],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0}
textarea{resize:vertical;min-height:70px}
label.l{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select{width:auto}
.people{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.person{cursor:pointer;text-align:left;width:100%}
.person:hover{border-color:var(--faint)}
.av{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;flex:none}
.ph{display:flex;gap:10px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
.tablewrap{overflow-x:auto}
.num{text-align:right;font-variant-numeric:tabular-nums}
ul.duty{margin:4px 0 10px;padding-left:18px}ul.duty li{margin:2px 0}
.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;max-height:320px;overflow:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
dialog{border:1px solid var(--line);border-radius:12px;padding:18px;width:min(560px,calc(100vw - 32px));background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:20}
.signin{max-width:420px;margin:60px auto}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-display);font-size:24px}
.kpi span{font-size:12px;color:var(--muted)}
.done .t{text-decoration:line-through;color:var(--faint)}
.bad{color:var(--crit);font-weight:600}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
@media print{header.top,.noprint{display:none!important}}
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="bar"><span class="brand">IPA Ops Board</span><span class="sync" id="sync"></span>
    <button class="btn small" id="addTaskBtn" type="button">+ Task</button></div>
  <nav class="tabs" id="tabs">
    <a href="#today">Today</a><a href="#team">Team</a><a href="#tasks">Tasks</a><a href="#kra">KRA reviews</a>
    <a href="#coach">Coach</a><a href="#log">Work log</a><a href="#meeting">Meeting</a><a href="#routine">Routine</a><a href="#expenses">Expenses</a><a href="#settings">Settings</a>
  </nav>
</header>
<main class="wrap" id="app"></main>
<dialog id="dlg"></dialog>
<script>
"use strict";
/* ---------- storage: ops.json in the private repository dikshabhargava31-ops/ipa_task ---------- */
const GH={owner:"dikshabhargava31-ops",repo:"ipa_task",branch:"main",path:"ops.json"};
const API=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/`;
const AUTH_KEY="ipa-priority-board-user";
let me=null;try{me=JSON.parse(localStorage.getItem(AUTH_KEY)||"null")}catch(_){}
let D=null,sha=null,pending=[],saving=false,timer=null,plan=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const todayISO=()=>iso(new Date());
const month=()=>todayISO().slice(0,7);
const dl=s=>s?Math.round((new Date(s.slice(0,10)+"T00:00:00")-today())/864e5):null;
const fmt=s=>s?new Date(s.slice(0,10)+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"}):"";
const monthName=m=>new Date(m+"-01T00:00:00").toLocaleDateString("en-IN",{month:"long",year:"numeric"});
const rupee=n=>"₹"+Math.round(+n||0).toLocaleString("en-IN");
const b64enc=s=>{const b=new TextEncoder().encode(s);let o="";for(let i=0;i<b.length;i+=32768)o+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(o)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const hdr=()=>({Accept:"application/vnd.github+json",Authorization:"Bearer "+me.token});
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}

async function readFile(path){
  const r=await fetch(`${API}${path}?ref=${GH.branch}&t=${Date.now()}`,{cache:"no-store",headers:hdr()});
  if(r.status===404)return{data:null,sha:null};
  if(!r.ok)throw Object.assign(new Error("read"),{status:r.status});
  const j=await r.json();return{data:JSON.parse(b64dec(j.content)),sha:j.sha}}
async function writeOps(data,s,msg){
  return fetch(API+GH.path,{method:"PUT",headers:{...hdr(),"Content-Type":"application/json"},body:JSON.stringify({
    message:`Ops board: ${me.name||"Diksha"} ${msg}`,branch:GH.branch,sha:s,content:b64enc(JSON.stringify(data,null,1)+"\n")})})}
function setSync(t){const e=$("#sync");if(e)e.textContent=t}
// Every change is a function. It runs on the screen at once, then is replayed on the newest copy of the
// file when saving, so a change made by the daily assistant in between is never overwritten.
function mutate(fn,msg){fn(D);pending.push({fn,msg});render(true);clearTimeout(timer);timer=setTimeout(flush,700);setSync("Saving…")}
async function flush(){
  if(saving||!pending.length)return;saving=true;const batch=pending.slice();
  try{
    for(let i=0;i<4;i++){
      const{data,sha:s}=await readFile(GH.path);const base=data||D;
      batch.forEach(b=>b.fn(base));
      const msgs=[...new Set(batch.map(b=>b.msg))];
      const r=await writeOps(base,s,msgs[0]+(msgs.length>1?` (+${msgs.length-1} more)`:""));
      if(r.ok){sha=(await r.json()).content.sha;pending=pending.slice(batch.length);D=base;pending.forEach(p=>p.fn(D));
        setSync("Saved "+new Date().toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}));render();break}
      if(r.status!==409&&r.status!==422)throw new Error("save "+r.status);
    }
  }catch(e){setSync("Not saved. Check your connection.");toast("Couldn't save. Trying again in 20 seconds.");setTimeout(flush,20000)}
  finally{saving=false;if(pending.length){clearTimeout(timer);timer=setTimeout(flush,700)}}
}
addEventListener("beforeunload",e=>{if(pending.length){e.preventDefault();e.returnValue=""}});

/* ---------- model helpers ---------- */
const person=id=>D.people.find(p=>p.id===id);
const whoName=id=>id==="me"?"Me":(person(id)||{}).name||id||"";
const first=n=>String(n).replace(/ Ma'am$/,"").split(" ")[0];
const open=t=>t.status!=="Done";
const projPri=n=>(D.projects.find(p=>p.name===n)||{}).priority||99;
const band=t=>{const d=dl(t.due);return d===null?4:d<0?0:d<=1?1:d<=7?2:3};
const priN={High:0,Medium:1,Low:2};
const cmp=(a,b)=>band(a)-band(b)||(priN[a.pri]??1)-(priN[b.pri]??1)||projPri(a.project)-projPri(b.project)||(a.due||"9999").localeCompare(b.due||"9999");
function dueChip(t){const d=dl(t.due);if(d===null||!open(t))return t.due?`<span class="chip">${fmt(t.due)}</span>`:"";
  if(d<-7)return`<span class="chip crit">Overdue</span>`;if(d<0)return`<span class="chip crit">${-d}d overdue</span>`;
  if(d===0)return`<span class="chip crit">Today</span>`;if(d===1)return`<span class="chip warn">Tomorrow</span>`;
  return`<span class="chip${d<=6?" warn":""}">${fmt(t.due)}</span>`}
function statusChip(s){const c={"In progress":"info",Waiting:"vio",Stuck:"crit",Done:"ok"}[s]||"";return`<span class="chip ${c}">${esc(s)}</span>`}
const sinceCheck=t=>{const d=t.lastCheck||t.assignedAt||t.createdAt;return d?-dl(d.slice(0,10)):99};
function needsFollowUp(t){if(t.who==="me"||!open(t))return false;const d=dl(t.due);return t.status==="Stuck"||(d!==null&&d<=1)||sinceCheck(t)>=2}

/* routines: daily (Mon–Sat), weekly on a weekday, monthly within a day range; season and yearly are ticked by hand */
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);
  const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+"-W"+pad(Math.ceil(((t-y)/864e5+1)/7))}
function cycleKey(r,d=new Date()){return r.freq==="daily"?iso(d):r.freq==="weekly"?isoWeek(d):r.freq==="monthly"?iso(d).slice(0,7):null}
// A routine counts only from the day the board started (D.routineSince), and a monthly one leaves Today
// five days after its window closes ("missed": still shown on the Routine tab).
function rState(r,d=new Date()){
  const key=cycleKey(r,d),last=D.routineDone[r.id];const done=key?last===key:false;const dow=d.getDay(),day=d.getDate();
  const since=D.routineSince||"2000-01-01",on=x=>iso(x)>=since;
  if(r.freq==="daily")return{due:dow!==0&&on(d),done,overdue:false};
  if(r.freq==="weekly"){const dueDay=new Date(d);dueDay.setDate(d.getDate()-(dow-r.dow));return{due:dow!==0&&dow>=r.dow&&on(dueDay),done,overdue:dow>r.dow}}
  if(r.freq==="monthly"){const lastDay=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),to=Math.min(r.to,lastDay);
    const start=new Date(d.getFullYear(),d.getMonth(),Math.min(r.from,lastDay));const inWin=day>=r.from&&on(start);
    return{due:inWin&&day<=to+5,done,overdue:inWin&&day>to,missed:inWin&&day>to+5&&!done}}
  return{due:false,done:false,overdue:false,last}}
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const ruleLabel=r=>r.freq==="daily"?"Every day":r.freq==="weekly"?"Every "+DOW[r.dow]:r.freq==="monthly"?`Monthly, ${r.from}–${r.to>=31?"month end":r.to}`:r.when;

/* KRA reviews */
const STAT=["On track","Needs attention","Off track"];
const rev=(m,pid)=>((D.reviews[m]||{})[pid])||null;
function overall(m,pid){const r=rev(m,pid),p=person(pid);if(!r)return"Not reviewed";const s=p.kras.map(k=>(r.k||{})[k.id]?.status).filter(Boolean);
  if(!s.length)return"Not reviewed";if(s.includes("Off track"))return"Off track";if(s.includes("Needs attention"))return"Needs attention";
  return s.length<p.kras.length?"In progress":"On track"}
function revChip(s){const c={"On track":"ok","Needs attention":"warn","Off track":"crit","In progress":"info"}[s]||"";return`<span class="chip ${c}">${esc(s)}</span>`}
function lastReviewed(pid){const ms=Object.keys(D.reviews).sort().reverse();for(const m of ms){const r=D.reviews[m][pid];if(r&&r.at)return r.at}return""}

/* messages to send on WhatsApp */
function dutyMessage(p){
  const L=[`Hi ${first(p.name)}, here's your role at IPA and what I'll review with you each month.`,"",`*Your role:* ${p.role}`];
  for(const[k,h]of[["daily","Every day"],["weekly","Every week"],["monthly","Every month"]]){if((p.duties[k]||[]).length){L.push("",`*${h}*`);p.duties[k].forEach(x=>L.push("• "+x))}}
  L.push("","*How you're measured (KRAs)*");p.kras.forEach(k=>L.push(`• ${k.kra}: ${k.measure}. Target: ${k.target}`));
  if((p.questions||[]).length){L.push("","*At your monthly review I'll ask*");p.questions.forEach((q,i)=>L.push(`${i+1}. ${q}`))}
  L.push("","Please fill your daily task sheet every working day. Message me if anything here isn't clear.",`– ${D.me}`);return L.join("\n")}
function tasksMessage(p){
  const ts=D.tasks.filter(t=>t.who===p.id&&open(t)).sort(cmp);
  if(!ts.length)return`Hi ${first(p.name)}, you have no open tasks from me right now. Thank you!`;
  const L=[`Hi ${first(p.name)}, your open tasks:`,""];
  ts.forEach((t,i)=>{const d=dl(t.due);L.push(`${i+1}. ${t.t}${t.due?` – ${d<0?"was due "+fmt(t.due):d===0?"today":"by "+fmt(t.due)}`:""}${t.status!=="Not started"?` (${t.status.toLowerCase()})`:""}`)});
  L.push("","Reply with an update on each, and tell me if anything is stuck.");return L.join("\n")}
function reviewMessage(p,m){
  const r=rev(m,p.id)||{k:{}};const L=[`Hi ${first(p.name)}, your KRA review for ${monthName(m)}:`,""];
  p.kras.forEach(k=>{const x=(r.k||{})[k.id]||{};L.push(`• ${k.kra} (target ${k.target}): ${x.actual||"–"}${x.status?` – ${x.status}`:""}`)});
  if(r.notes)L.push("",r.notes);L.push("",`Overall: ${overall(m,p.id)}.`,`– ${D.me}`);return L.join("\n")}
const waLink=(p,text)=>{const n=String(p.phone||"").replace(/\D/g,"");const num=n.length===10?"91"+n:n;return`https://wa.me/${num}?text=${encodeURIComponent(text)}`};
async function copy(t){try{await navigator.clipboard.writeText(t);toast("Copied. Paste it in WhatsApp.")}catch(_){toast("Select the text and copy it.")}}

/* ---------- views ---------- */
let view="today",arg="",filt={who:"all",status:"open",project:"all"},expMonth=month(),kraMonth=month();
function taskRow(t,opts={}){
  return`<div class="row ${open(t)?"":"done"}"><input type="checkbox" data-done="${t.id}" ${open(t)?"":"checked"} aria-label="Done">
  <div class="main"><div class="t">${esc(t.t)}</div><div class="meta">${dueChip(t)}${t.status!=="Not started"&&open(t)?statusChip(t.status):""}
  ${opts.noWho||t.who==="me"?"":`<span class="chip info">${esc(whoName(t.who))}</span>`}${t.project&&!opts.noProject?`<span>${esc(t.project)}</span>`:""}
  ${opts.check&&t.who!=="me"?`<span>Last check-in: ${sinceCheck(t)>=99?"never":sinceCheck(t)===0?"today":sinceCheck(t)+"d ago"}</span>`:""}</div></div>
  ${opts.check&&t.who!=="me"?`<button class="btn small" data-checkin="${t.id}" type="button">Checked in</button>`:""}
  <button class="btn link" data-edit="${t.id}" type="button">Edit</button></div>`}

function vToday(){
  const mine=D.tasks.filter(t=>t.who==="me"&&open(t)).sort(cmp);
  const dayList=D.tasks.filter(t=>t.plannedFor===todayISO()).sort((a,b)=>(a.order||0)-(b.order||0));
  let top=dayList.slice();if(!top.length&&plan&&plan.date===todayISO())top=(plan.top||[]).map(x=>D.tasks.find(t=>t.id===x.id)).filter(Boolean);
  if(!top.length)top=mine.filter(t=>t.status!=="Waiting").slice(0,3);
  const restMine=mine.filter(t=>!top.includes(t));
  const steps=Object.fromEntries(((plan&&plan.top)||[]).map(x=>[x.id,x.first_step]));
  const rs=D.routines.filter(r=>{const s=rState(r);return s.due&&!s.done}).sort((a,b)=>rState(b).overdue-rState(a).overdue);
  const fu=D.tasks.filter(needsFollowUp).sort(cmp);
  const pendingExp=D.expenses.filter(e=>e.status==="Pending approval");
  const dayN=new Date().getDate(),revDue=dayN>=25?D.people.filter(p=>overall(month(),p.id)==="Not reviewed"):[];
  const doneToday=D.tasks.filter(t=>t.doneAt&&t.doneAt.slice(0,10)===todayISO()).length;

function workLog(){
  const out=[];const ist=s=>{const d=new Date(s);return iso(d)};
  D.tasks.filter(t=>t.status==="Done"&&t.doneAt).forEach(t=>out.push({id:"t-"+t.id,at:t.doneAt,kind:t.who==="me"?"task":"team",text:t.t,area:t.project,who:t.who}));

  Object.entries(D.reviews||{}).forEach(([m,ps])=>Object.entries(ps).forEach(([pid,r])=>{if(r.at)out.push({id:"rv-"+m+pid,at:r.at+"T12:00:00",kind:"review",text:`KRA review: ${whoName(pid)} (${monthName(m)})`})}));
  (D.meetings||[]).forEach(m=>out.push({id:"mt-"+m.id,at:m.date+"T11:00:00",kind:"meeting",text:"Team meeting"}));
  return out.map(x=>({...x,day:ist(x.at)})).sort((a,b)=>b.at.localeCompare(a.at))}

function render(force){
  if(!D)return;const app=$("#app");const y=scrollY;
  const keep=document.activeElement&&document.activeElement.matches("input[type=text],textarea,input[type=number],input[type=tel]")?document.activeElement:null;
  if(keep&&app.contains(keep)&&!force)return; // a background refresh never redraws while you're typing
  app.innerHTML=(VIEWS[view]||vToday)();
  document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+({person:"team",review:"kra"}[view]||view)));

const nowZ=()=>new Date().toISOString().slice(0,19)+"Z";
function addTask(o){const t={id:rid(),t:o.t.trim(),who:o.who||"me",project:o.project||"",due:o.due||"",pri:o.pri||"Medium",status:"Not started",note:"",createdAt:nowZ(),
  ...(o.who&&o.who!=="me"?{assignedAt:nowZ()}:{}),...(o.meeting?{meeting:o.meeting}:{})};
  mutate(d=>{if(!d.tasks.some(x=>x.id===t.id))d.tasks.push(t)},`added “${t.t}”${t.who!=="me"?" for "+whoName(t.who):""}`)}
function setTask(id,patch,msg){mutate(d=>{const t=d.tasks.find(x=>x.id===id);if(t)Object.assign(t,patch)},msg)}
const T=id=>D.tasks.find(t=>t.id===id);

document.addEventListener("change",e=>{const el=e.target;
  if(el.dataset.done){const t=T(el.dataset.done);if(!t)return;const done=el.checked;
    setTask(t.id,done?{status:"Done",doneAt:nowZ()}:{status:"Not started",doneAt:""},`${done?"finished":"reopened"} “${t.t}”`);if(done)toast("Done ✓");return}
  if(el.dataset.rdone){const r=D.routines.find(x=>x.id===el.dataset.rdone);const key=cycleKey(r);const on=el.checked;
    const lid="rt-"+r.id+"-"+key;mutate(d=>{d.log=d.log||[];if(on){d.routineDone[r.id]=key;if(!d.log.some(x=>x.id===lid))d.log.push({id:lid,at:nowZ(),kind:"routine",text:r.task,area:r.area})}
      else{delete d.routineDone[r.id];d.log=d.log.filter(x=>x.id!==lid)}},`${on?"ticked":"unticked"} routine “${r.task}”`);return}
  if(el.dataset.rmanual){const r=D.routines.find(x=>x.id===el.dataset.rmanual);const on=el.checked;const lid="rt-"+r.id+"-"+todayISO();
    mutate(d=>{d.log=d.log||[];if(on){d.routineDone[r.id]=todayISO();if(!d.log.some(x=>x.id===lid))d.log.push({id:lid,at:nowZ(),kind:"routine",text:r.task,area:r.area})}else{delete d.routineDone[r.id];d.log=d.log.filter(x=>x.id!==lid)}},`ticked “${r.task}”`);return}
  if(el.dataset.f){filt[el.dataset.f]=el.value;render();return}
  if(el.id==="kraMonth"){kraMonth=el.value;render();return}
  if(el.id==="expMonth"){expMonth=el.value;render();return}
  if(el.dataset.estat){const id=el.dataset.estat,v=el.value;mutate(d=>{const x=d.expenses.find(z=>z.id===id);if(x){x.status=v;if(v!=="Pending approval")x.approvedBy=me.name}},`set an expense to ${v}`);return}
  if(el.dataset.budget){const c=el.dataset.budget,v=+el.value||0;mutate(d=>{if(v)d.budget[c]=v;else delete d.budget[c]},`set the ${c} budget`);el.blur();return}
  if(el.dataset.phone){const id=el.dataset.phone,v=el.value.trim();mutate(d=>{const p=d.people.find(x=>x.id===id);if(p)p.phone=v},`saved a phone number`);el.blur();return}
  if(el.dataset.ract||el.dataset.rstat){const kid=el.dataset.ract||el.dataset.rstat,field=el.dataset.ract?"actual":"status",v=el.value,m=kraMonth,pid=arg;
    mutate(d=>{d.reviews[m]=d.reviews[m]||{};const r=d.reviews[m][pid]=d.reviews[m][pid]||{k:{}};r.k=r.k||{};r.k[kid]=r.k[kid]||{};r.k[kid][field]=v;r.at=todayISO()},`reviewed ${whoName(pid)} for ${m}`);el.blur();return}
  if(el.dataset.rnotes){const v=el.value,m=kraMonth,pid=arg;mutate(d=>{d.reviews[m]=d.reviews[m]||{};const r=d.reviews[m][pid]=d.reviews[m][pid]||{k:{}};r.notes=v;r.at=todayISO()},`added review notes for ${whoName(pid)}`);el.blur();return}
  if(el.dataset.mnotes){const id=el.dataset.mnotes,v=el.value;mutate(d=>{const x=d.meetings.find(z=>z.id===id);if(x)x.notes=v},"saved meeting notes");el.blur();return}
});
document.addEventListener("submit",e=>{const f=e.target;e.preventDefault();const v=Object.fromEntries(new FormData(f));
  if(f.id==="logQuick"||f.id==="logForm"){const x={id:rid(),at:nowZ(),kind:"note",text:v.text.trim(),area:v.area||"",mins:+v.mins||0};
    mutate(d=>{d.log=d.log||[];if(!d.log.some(z=>z.id===x.id))d.log.push(x)},"logged work");f.reset();toast("Logged");return}
  if(f.id==="newTask"||f.id==="dlgTask"){addTask(v);f.reset();if(f.id==="dlgTask")$("#dlg").close();toast("Task added");return}
  if(f.dataset.addfor){addTask({...v,who:f.dataset.addfor});f.reset();return}
  if(f.id==="newAction"){const cur=D.meetings.find(x=>x.date===todayISO());addTask({...v,meeting:cur?cur.id:"m-"+todayISO(),project:"Team & HR"});f.reset();return}
  if(f.id==="newExp"){const x={id:rid(),...v,amount:+v.amount||0,createdAt:nowZ()};mutate(d=>{if(!d.expenses.some(z=>z.id===x.id))d.expenses.push(x)},`logged an expense of ${rupee(x.amount)}`);toast("Expense added");return}
  if(f.id==="taskForm"){const id=f.dataset.id;const t=T(id);const patch={t:v.t.trim(),who:v.who,project:v.project,due:v.due,pri:v.pri,status:v.status,note:v.note,plannedFor:v.plannedFor||""};
    if(v.plannedFor&&v.plannedFor!==t.plannedFor)patch.order=Math.max(0,...D.tasks.filter(x=>x.plannedFor===v.plannedFor).map(x=>x.order||0))+1;
    if(v.status==="Done"&&t.status!=="Done")patch.doneAt=nowZ();if(v.who!==t.who&&v.who!=="me")patch.assignedAt=nowZ();
    setTask(id,patch,`edited “${patch.t}”`);$("#dlg").close();return}
  if(f.id==="dutyForm"){const id=f.dataset.id;const lines=s=>s.split("\n").map(x=>x.replace(/^[•\-\s]+/,"").trim()).filter(Boolean);
    mutate(d=>{const p=d.people.find(x=>x.id===id);if(p){p.role=v.role.trim()||p.role;p.duties={daily:lines(v.daily),weekly:lines(v.weekly),monthly:lines(v.monthly)};p.questions=lines(v.questions)}},`edited ${whoName(id)}'s duties`);$("#dlg").close();return}
  if(f.id==="kraForm"){const id=f.dataset.id;const ks=v.kras.split("\n").map(l=>l.split("|").map(x=>x.trim())).filter(x=>x[0]);
    mutate(d=>{const p=d.people.find(x=>x.id===id);if(p)p.kras=ks.map(k=>({id:k[0].toLowerCase().replace(/[^a-z0-9]+/g,"-"),kra:k[0],measure:k[1]||"",target:k[2]||""}))},`edited ${whoName(id)}'s KRAs`);$("#dlg").close();return}
  if(f.id==="personForm"){const id=v.name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");if(!id||person(id)){toast("That name is taken.");return}
    mutate(d=>d.people.push({id,name:v.name.trim(),role:v.role.trim(),group:"",phone:v.phone||"",kras:[{id:"daily-task-sheet",kra:"Daily task sheet",measure:"Filled every working day",target:"100%"}],duties:{daily:["Fill your daily task sheet before you leave"],weekly:[],monthly:[]},questions:[]}),`added ${v.name.trim()}`);$("#dlg").close();location.hash="person/"+id;return}
  if(f.id==="routineForm"){const id=f.dataset.id||"r"+rid();const r={id,freq:v.freq,task:v.task.trim(),when:v.when.trim(),area:v.area.trim(),role:v.role,who:v.who.trim(),
    ...(v.freq==="weekly"?{dow:+v.dow}:{}),...(v.freq==="monthly"?{from:+v.from||1,to:+v.to||31}:{})};
    mutate(d=>{const i=d.routines.findIndex(x=>x.id===id);if(i<0)d.routines.push(r);else d.routines[i]=r},`saved routine “${r.task}”`);$("#dlg").close();return}
  if(f.id==="signin"){signIn(v);return}
});
document.addEventListener("click",e=>{const el=e.target.closest("button,[data-person]");if(!el)return;const ds=el.dataset;
  if(ds.person){location.hash="person/"+ds.person;return}

  if(ds.copy){const p=person(arg);copy(ds.copy==="duty"?dutyMessage(p):ds.copy==="tasks"?tasksMessage(p):reviewMessage(p,kraMonth));return}
  if(ds.editduties!==undefined){editDuties(ds.editduties);return}
  if(ds.editkras!==undefined){editKras(ds.editkras);return}

  if(ds.backup!==undefined){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:"application/json"}));a.download=`ipa-ops-board-${todayISO()}.json`;a.click();return}
  if(ds.signout!==undefined){try{localStorage.removeItem(AUTH_KEY)}catch(_){}location.reload();return}
  if(ds.close!==undefined){$("#dlg").close();return}
  if(ds.coachtask){addTask({t:ds.coachtask,who:"me",project:"",due:""});toast("Added to your tasks");return}
  if(ds.copytext){copy(ds.copytext);return}
  if(ds.dellog){const id=ds.dellog;mutate(d=>{d.log=(d.log||[]).filter(x=>x.id!==id)},"removed a log entry");return}
  if(ds.deltask){const t=T(ds.deltask);if(confirm(`Delete “${t.t}”?`)){mutate(d=>{d.tasks=d.tasks.filter(x=>x.id!==t.id)},`deleted “${t.t}”`);$("#dlg").close()}return}
  if(ds.delroutine){const r=D.routines.find(x=>x.id===ds.delroutine);if(confirm(`Delete routine “${r.task}”?`)){mutate(d=>{d.routines=d.routines.filter(x=>x.id!==r.id);delete d.routineDone[r.id]},`deleted routine “${r.task}”`);$("#dlg").close()}return}
});

function signInPage(err){

async function signIn(v){me={name:v.name.trim(),token:v.token.trim()};try{await start();localStorage.setItem(AUTH_KEY,JSON.stringify({...me,canWrite:true}))}catch(e){me=null;signInPage("That token can't open the board. Check it has the “repo” box ticked.")}}
async function start(){
  setSync("Loading…");const r=await readFile(GH.path);if(!r.data)throw new Error("no data");D=r.data;sha=r.sha;
  D.routineDone=D.routineDone||{};D.log=D.log||[];if(!D.routineSince)D.routineSince=todayISO();D.reviews=D.reviews||{};D.meetings=D.meetings||[];D.expenses=D.expenses||[];D.budget=D.budget||{};
  $("#top").hidden=false;setSync("Up to date");route();
  try{const p=await readFile(`assistant/plans/${todayISO()}.json`);plan=p.data;if(view==="today"||view==="coach")render()}catch(_){}
  setInterval(async()=>{if(pending.length||saving||document.hidden)return;try{const x=await readFile(GH.path);if(x.sha!==sha){D=x.data;sha=x.sha;render()}}catch(_){}},120000)}
if(me&&me.token)start().catch(e=>signInPage(e.status===401||e.status===403||e.status===404?"Your sign-in has expired. Sign in again.":"Couldn't load the board. Check your connection and reload."));else signInPage();
</script>
</body>
</html>
