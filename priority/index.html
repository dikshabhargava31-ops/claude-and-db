<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IPA Priority Board</title>
<meta name="description" content="IPA projects and tasks in priority order, with what to do now and a timeline.">
<style>body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: workspace page — project gallery on top, do-this-now strip, tabbed task views (Kanban / By day / By project), then a day-grid timeline of projects. */
:root{
  --bg:#ffffff; --panel:#f7f7f5; --sunk:#efefec; --line:#e6e5e1; --hover:#f3f3f0;
  --ink:#1f1f1d; --muted:#6b6a65; --faint:#8f8e88;
  --accent:#c2700a; --accent-soft:#fbefdd;
  --crit:#c4362b; --crit-soft:#fbe4e1; --warn:#9a6900; --warn-soft:#faf0d4;
  --ok:#2f7d4f; --ok-soft:#e1f2e7; --info:#2f63b8; --info-soft:#e3ebf8; --grey-soft:#ececea;
  --h1:#e9dcf6; --h2:#dcebf8; --h3:#fbe7d2; --h4:#f8dcdc; --h5:#dff1e6; --h6:#f3ecd2; --h7:#e2e6ef;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191919; --panel:#202020; --sunk:#2a2a2a; --line:#323232; --hover:#262626;
  --ink:#ebebe8; --muted:#a3a29c; --faint:#85847e;
  --accent:#f0a33a; --accent-soft:#3a2a12;
  --crit:#f0786d; --crit-soft:#3d1f1d; --warn:#e8b94a; --warn-soft:#382d12;
  --ok:#6cc893; --ok-soft:#183126; --info:#8ea8f0; --info-soft:#1e2640; --grey-soft:#2f2f2f;
  --h1:#372c47; --h2:#223447; --h3:#45311c; --h4:#452626; --h5:#1f3a2b; --h6:#3d3519; --h7:#2a2f3c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191919; --panel:#202020; --sunk:#2a2a2a; --line:#323232; --hover:#262626;
  --ink:#ebebe8; --muted:#a3a29c; --faint:#85847e;
  --accent:#f0a33a; --accent-soft:#3a2a12;
  --crit:#f0786d; --crit-soft:#3d1f1d; --warn:#e8b94a; --warn-soft:#382d12;
  --ok:#6cc893; --ok-soft:#183126; --info:#8ea8f0; --info-soft:#1e2640; --grey-soft:#2f2f2f;
  --h1:#372c47; --h2:#223447; --h3:#45311c; --h4:#452626; --h5:#1f3a2b; --h6:#3d3519; --h7:#2a2f3c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:1200px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:34px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(1.9rem,4.5vw,2.6rem);line-height:1.05}
h2{font-size:1.35rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}

header{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:end;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 12px;font-weight:500;font-size:.9rem}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--info);color:#fff;border-color:var(--info)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.stat b{font-variant-numeric:tabular-nums;color:var(--ink)} .stat .c b{color:var(--crit)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:7px 10px;font-size:.9rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:500}
.tabs button:focus-visible{outline:2px solid var(--accent)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;line-height:1;padding:4px 8px;border-radius:999px;background:var(--grey-soft);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.prog{background:var(--info-soft);color:var(--info)}
.pill.wait{background:var(--crit-soft);color:var(--crit)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.chip{font:500 .72rem/1 var(--f-mono);padding:4px 7px;border-radius:5px;background:var(--grey-soft);color:var(--muted);white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.est{background:transparent;border:1px dashed var(--faint)}
.pr{font:600 .7rem/1 var(--f-mono);padding:4px 6px;border-radius:4px;background:var(--ink);color:var(--bg)}

/* gallery */
.gallery{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.pcard{all:unset;cursor:pointer;display:grid;grid-template-rows:110px auto;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);min-width:0}
.pcard:hover{background:var(--hover)}
.pcard:focus-visible{outline:2px solid var(--accent)}
.cover{display:grid;place-items:center;position:relative}
.cover svg{width:64px;height:64px;stroke:var(--ink);opacity:.72;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cover .pr{position:absolute;top:8px;left:8px}
.pbody{padding:10px 12px 12px;display:grid;gap:7px}
.pbody .name{font-weight:600;line-height:1.25}
.pbody .left{font-size:.82rem;color:var(--muted)}

/* focus */
.focus{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.focus .tag{font:600 .7rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);writing-mode:horizontal-tb}
.focus .t{font-weight:600;font-size:1.05rem}
.focus .then{font-size:.85rem;color:var(--muted)}
@media (max-width:620px){.focus{grid-template-columns:1fr}}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel);border-radius:8px;padding:8px;display:grid;gap:6px;align-content:start;min-height:120px}
.col.drop{outline:2px dashed var(--info);outline-offset:-2px}
.col-head{display:flex;gap:8px;align-items:center;padding:2px 4px 6px}
.tcard{all:unset;cursor:grab;display:grid;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;box-shadow:0 1px 1px rgb(0 0 0 / .04)}
.tcard:hover{border-color:var(--faint)}
.tcard:focus-visible{outline:2px solid var(--accent)}
.tcard .t{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;font-weight:500;overflow-wrap:anywhere}
.tcard .t i{flex:none;width:14px;height:14px;border:1.5px solid var(--faint);border-radius:50%;margin-top:3px}
.tcard.isdone .t i{background:var(--ok);border-color:var(--ok)}
.tcard .meta,.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.proj{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.proj::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--sw,var(--sunk))}
.col .more{justify-self:start}

/* lists */
.bucket{display:grid;gap:2px}
.bucket h3{font-size:1rem;padding:10px 0 6px;display:flex;gap:8px;align-items:baseline}
.bucket[data-b="over"] h3{color:var(--crit)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 6px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--hover)}
.row input{width:17px;height:17px;margin-top:3px;accent-color:var(--ok)}
.row .t{min-width:0;overflow-wrap:anywhere;cursor:pointer}
.row.isdone .t{text-decoration:line-through;color:var(--faint)}
.row .right{display:flex;gap:6px;flex-wrap:wrap;justify-content:end}
.group-head{display:flex;gap:10px;align-items:center;padding:14px 0 6px}

/* timeline */
.tl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tl{position:relative;min-width:1100px}
.tl-days{display:grid;border-bottom:1px solid var(--line);background:var(--bg);position:relative}
.tl-days div{font:.7rem var(--f-mono);color:var(--faint);text-align:center;padding:4px 0}
.tl-days div.wk{color:var(--muted)} .tl-days div.now{color:var(--bg);background:var(--crit);border-radius:4px;margin:2px}
.tl-months{display:grid;font-size:.8rem;font-weight:600;padding:6px 0 0}
.tl-body{position:relative;display:grid;gap:10px;padding:12px 0 16px}
.tl-grid{position:absolute;inset:0;display:grid;pointer-events:none}
.tl-grid div{border-left:1px solid transparent}
.tl-grid div.we{background:var(--panel)}
.tl-grid div.now{border-left:2px solid var(--crit)}
.tl-row{position:relative;height:34px}
.tl-bar{all:unset;cursor:pointer;position:absolute;top:2px;height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);box-shadow:0 1px 2px rgb(0 0 0 / .06);white-space:nowrap;overflow:hidden;font-size:.85rem;font-weight:500;min-width:40px}
.tl-bar:hover{border-color:var(--faint)}
.tl-bar .sw{width:10px;height:10px;border-radius:3px;flex:none}
.tl-tick{position:absolute;bottom:-4px;width:6px;height:6px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.tl-tick.crit{background:var(--crit)}

/* dialog */
.scrim{position:fixed;inset:0;background:rgb(10 10 10 / .4);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:12px;width:min(720px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:grid;gap:14px}
.sheet.narrow{width:min(460px,100%)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid3{grid-template-columns:1fr}}
.field{display:grid;gap:5px}
.lbl{font:500 .72rem/1 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input,.field select,.field textarea,.trow input,.trow select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;width:100%}
.field textarea{min-height:60px;resize:vertical}
.tlist{display:grid;gap:6px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 135px 120px 130px auto;gap:6px;align-items:center}
@media (max-width:620px){.trow{grid-template-columns:1fr 1fr}.trow [data-f="t"]{grid-column:1/-1}}
.sheet-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:8px;padding:14px;color:var(--faint);font-size:.88rem}
/* attention */
.attention{border:1px solid var(--crit);background:var(--crit-soft);border-radius:8px;padding:12px 14px;gap:6px}
.att-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;color:var(--crit)}
.att-head .muted{color:var(--ink);opacity:.75}
.att-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid rgb(196 54 43 / .2)}
.chip.idle{background:var(--crit-soft);color:var(--crit)}

/* quote */
.quote{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 20px;border-radius:10px;background:var(--accent-soft)}
.quote .mark{font:700 3.2rem/0.6 var(--f-display);color:var(--accent);padding-top:14px}
.quote blockquote{margin:0;font:600 clamp(1.05rem,2.4vw,1.3rem)/1.35 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.quote figcaption{margin-top:6px;font-size:.85rem;color:var(--muted)}
@media (max-width:560px){.quote{grid-template-columns:minmax(0,1fr)}.quote .mark{display:none}}

/* calendar */
.cal-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cal-bar h3{font-size:1.1rem;min-width:150px}
.cal-scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));min-width:720px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dow{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
.cal .day{min-height:112px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;gap:4px;align-content:start;cursor:pointer}
.cal .day:hover{background:var(--hover)}
.cal .day.out{background:var(--panel)} .cal .day.out .dn{color:var(--faint)}
.cal .dn{font:500 .8rem var(--f-mono);justify-self:end;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal .day.today .dn{background:var(--crit);color:#fff}
.cal .ev{all:unset;cursor:pointer;display:block;font-size:.75rem;line-height:1.25;padding:3px 6px;border-radius:4px;background:var(--sw);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev.done{text-decoration:line-through;opacity:.6}
.cal .ev.est{outline:1px dashed var(--faint);outline-offset:-1px}
.cal .ev:focus-visible{outline:2px solid var(--accent)}
.cal .more{font-size:.72rem;color:var(--muted);padding-left:4px}

/* project folder */
.panel{width:min(1240px,100%);height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);padding:0;gap:0;overflow:hidden}
.panel-head{padding:18px 22px 0;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.panel-head .tabs{border-bottom:0}
.panel-title{display:flex;justify-content:space-between;gap:10px;align-items:start}
.panel-title > div{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.panel-body{overflow:auto;padding:18px 22px 24px;display:grid;gap:18px;align-content:start}
.ov{display:grid;gap:14px;max-width:760px}
.drop{display:grid;gap:4px;place-items:center;text-align:center;border:1.5px dashed var(--line);border-radius:8px;padding:22px;color:var(--muted);cursor:pointer}
.drop:hover,.drop.on{border-color:var(--info);background:var(--info-soft);color:var(--info)}
.drop b{color:var(--ink)}
.linkform{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px}
.linkform input{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;width:100%}
@media (max-width:620px){.linkform{grid-template-columns:1fr}}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.file{border:1px solid var(--line);border-radius:8px;overflow:hidden;display:grid;grid-template-rows:100px auto;min-width:0}
.file .thumb{background:var(--panel);display:grid;place-items:center;overflow:hidden;border:0;padding:0}
.file .thumb img,.file .thumb video{width:100%;height:100%;object-fit:cover}
.file .ext{font:600 .85rem var(--f-mono);color:var(--muted);border:1px solid var(--line);padding:8px 10px;border-radius:4px;background:var(--bg);text-transform:uppercase}
.file .fb{padding:8px 10px 10px;display:grid;gap:6px}
.file .fn{font-weight:500;font-size:.88rem;overflow-wrap:anywhere}
.links{display:grid}
.link{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line)}
.link:hover{background:var(--hover)}
.link .ic{width:28px;height:28px;border-radius:6px;background:var(--panel);display:grid;place-items:center;font:600 .7rem var(--f-mono);color:var(--muted)}
.link a{color:var(--ink);font-weight:500;text-decoration:none;overflow-wrap:anywhere}
.link a:hover{text-decoration:underline}
.sub{font-size:.95rem;display:flex;gap:8px;align-items:baseline}
.lightbox{display:grid;gap:10px;justify-items:center}
.lightbox img,.lightbox video{max-width:100%;max-height:75vh;border-radius:6px}
#dlg2 .scrim{z-index:25}
.who{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;line-height:1;color:var(--ink);white-space:nowrap}
.who b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--info-soft);color:var(--info);font:600 .65rem/1 var(--f-body)}
.by{color:var(--muted);font-size:.82rem}
.sel{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 8px;font-size:.88rem;max-width:100%}
.me{font-size:.88rem;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.me b{color:var(--ink);font-weight:600}
.sync{display:inline-flex;gap:6px;align-items:center}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.ok::before{background:var(--ok)} .sync.saving::before{background:var(--warn)} .sync.bad::before{background:var(--crit)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.88rem;z-index:30}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:grid;gap:8px">
      <span class="muted small mono" id="today"></span>
      <h1>IPA Priority Board</h1>
      <div class="stat" id="stat"></div>
    </div>
    <div class="actions">
      <span class="me" id="me"></span>
      <button class="btn ghost" id="exportBtn" type="button">Back up</button>
      <button class="btn ghost" id="importBtn" type="button">Restore</button>
      <input type="file" id="importIn" accept=".json,application/json" hidden>
      <button class="btn" id="addTaskBtn" type="button">+ Task</button>
      <button class="btn primary" id="addBtn" type="button">+ Project</button>
    </div>
  </header>

  <figure class="quote" id="quote" aria-live="polite"></figure>

  <section>
    <h2>Projects</h2>
    <div class="tabs" role="tablist" id="ptabs">
      <button role="tab" data-pf="all" aria-selected="true" type="button">All projects</button>
      <button role="tab" data-pf="In progress" aria-selected="false" type="button">In progress</button>
      <button role="tab" data-pf="Not started" aria-selected="false" type="button">Not started</button>
      <button role="tab" data-pf="Waiting" aria-selected="false" type="button">Waiting</button>
      <button role="tab" data-pf="Done" aria-selected="false" type="button">Done</button>
    </div>
    <div class="gallery" id="gallery"></div>
  </section>

  <section class="attention" id="attention" hidden aria-live="polite"></section>

  <section class="focus" id="focus" aria-live="polite"><span class="tag">Do this now</span><span class="muted">Loading…</span><span></span></section>

  <section>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px">
      <h2>Tasks</h2><label class="small muted">Show tasks for <select class="sel" id="personSel"></select></label>
    </div>
    <div class="tabs" role="tablist" id="ttabs">
      <button role="tab" data-tv="kanban" aria-selected="true" type="button">Kanban</button>
      <button role="tab" data-tv="day" aria-selected="false" type="button">By day</button>
      <button role="tab" data-tv="project" aria-selected="false" type="button">By project</button>
      <button role="tab" data-tv="calendar" aria-selected="false" type="button">Calendar</button>
    </div>
    <div id="tasks"></div>
  </section>

  <section>
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px 12px">
      <h2>Timeline</h2><span class="muted small">Each bar runs from today to the project's last open deadline. Dots are task deadlines.</span>
    </div>
    <div class="tl-scroll"><div class="tl" id="timeline"></div></div>
  </section>

  <footer class="muted small" style="display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px">

<script>
const TSTAT=["Not started","In progress","Waiting","Done"];
const PSTAT=["Not started","In progress","Waiting","Done"];
const ICONS={
  check:'<rect x="14" y="8" width="36" height="48" rx="4"/><path d="M22 22h20M22 31h12"/><path d="M24 44l6 6 12-14"/>',
  steps:'<path d="M8 52h14V40h14V28h14V14h6"/><path d="M48 14l8 0M52 10v8"/>',
  cap:'<path d="M6 26l26-12 26 12-26 12z"/><path d="M16 31v12c6 6 26 6 32 0V31"/><path d="M58 26v14"/>',
  play:'<rect x="6" y="14" width="52" height="36" rx="10"/><path d="M27 24v16l14-8z"/>',
  grid:'<rect x="8" y="8" width="13" height="13" rx="2"/><rect x="25" y="8" width="13" height="13" rx="2"/><rect x="42" y="8" width="13" height="13" rx="2"/><rect x="8" y="25" width="13" height="13" rx="2"/><rect x="25" y="25" width="13" height="13" rx="2"/><rect x="42" y="25" width="13" height="13" rx="2"/><rect x="8" y="42" width="13" height="13" rx="2"/><rect x="25" y="42" width="13" height="13" rx="2"/><rect x="42" y="42" width="13" height="13" rx="2"/>',
  briefcase:'<rect x="8" y="20" width="48" height="32" rx="4"/><path d="M24 20v-6h16v6M8 34h48"/>',
  building:'<path d="M10 54V22l22-12 22 12v32"/><path d="M6 54h52M24 54V38h16v16M20 28h4M40 28h4"/>',
  spark:'<path d="M32 8v48M8 32h48M15 15l34 34M49 15L15 49"/>'
};
let db=null, canWrite=false, person="all", projects=[], pf="all", tv="kanban", expanded={};
let assetsNs=null, dlNs=null, filesBy={}, fileSubs={}, openP=null, pTab="overview";
const TYPES={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",svg:"image/svg+xml",mp4:"video/mp4",webm:"video/webm",csv:"text/csv",md:"text/markdown",json:"application/json",txt:"text/plain"};
const OFFICE=new Set(["doc","docx","xls","xlsx","ppt","pptx","odt","ods","odp","pages","numbers","key"]);
try{tv=localStorage.getItem("pb-tv")||"kanban";person=localStorage.getItem("pb-person")||"all"}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dl=s=>s?Math.round((new Date(s+"T00:00:00")-today0())/864e5):null;
const fmt=s=>s?new Date(s+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"}):"";
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const rid=()=>Math.random().toString(36).slice(2,9);
const tstat=t=>t.status||(t.done?"Done":"Not started");
const hue=p=>`var(--h${((+p.priority||7)-1)%7+1})`;
const pcls=s=>s==="In progress"?"prog":s==="Waiting"?"wait":s==="Done"?"done":"";
const pill=s=>`<span class="pill ${pcls(s)}">${esc(s)}</span>`;
function projStatus(p){if(p.status)return p.status;const ts=p.tasks||[];if(ts.length&&ts.every(t=>tstat(t)==="Done"))return"Done";if(ts.some(t=>tstat(t)!=="Not started"))return"In progress";return"Not started"}
function dueChip(t){const d=dl(t.due);const e=t.est?" est":"";if(d===null)return"";
  if(tstat(t)==="Done")return`<span class="chip">${fmt(t.due)}</span>`;
  if(d<0)return`<span class="chip crit">${-d}d overdue</span>`;if(d===0)return`<span class="chip crit${e}">Today</span>`;
  if(d===1)return`<span class="chip warn${e}">Tomorrow</span>`;if(d<=6)return`<span class="chip warn${e}">${fmt(t.due)}</span>`;
  return`<span class="chip${e}">${fmt(t.due)}</span>`}
const byPri=()=>[...projects].sort((a,b)=>(+a.priority||99)-(+b.priority||99));
function allTasks(){const o=[];byPri().forEach(p=>(p.tasks||[]).forEach(t=>o.push({...t,st:tstat(t),p})));return o.filter(forPerson)}
const norm=s=>String(s||"").trim().toLowerCase();
function forPerson(t){if(person==="all")return true;if(person==="__none")return !norm(t.who);return norm(t.who)===norm(person==="__me"?myName():person)}
function people(){const m=new Map();const add=n=>{n=String(n||"").trim();if(n&&!m.has(norm(n)))m.set(norm(n),n)};
  if(myName())add(myName());projects.forEach(p=>{add(p.owner);(p.tasks||[]).forEach(t=>add(t.who))});return[...m.values()].sort((a,b)=>a.localeCompare(b))}
const whoChip=n=>n?`<span class="who" title="Assigned to ${esc(n)}"><b aria-hidden="true">${esc(n.trim()[0].toUpperCase())}</b>${esc(n)}</span>`:"";
// Order: urgency band first (overdue, due within a day, this week, later), then your project priority, then date.
const band=t=>{const d=dl(t.due);return d===null?4:d<0?0:d<=1?1:d<=7?2:3};
const cmp=(a,b)=>band(a)-band(b)||(+a.p.priority||99)-(+b.p.priority||99)||(a.due||"9999").localeCompare(b.due||"9999")||(a.est?1:0)-(b.est?1:0);
const openTasks=()=>allTasks().filter(t=>t.st!=="Done"&&projStatus(t.p)!=="Done").sort(cmp);

function taskCard(t){return`<button class="tcard ${t.st==="Done"?"isdone":""}" type="button" draggable="${canWrite}" data-task="${esc(t.p.id)}|${esc(t.id)}">
  <span class="t"><i aria-hidden="true"></i><span>${esc(t.t)}</span></span>
  <span class="meta"><span class="proj" style="--sw:${hue(t.p)}">${esc(t.p.name)}</span>${dueChip(t)}${whoChip(t.who)}</span></button>`}

function render(){
  $("#today").textContent=new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const open=openTasks();
  const over=open.filter(t=>band(t)===0).length, tod=open.filter(t=>dl(t.due)===0).length, wk=open.filter(t=>{const d=dl(t.due);return d!==null&&d>=0&&d<=7}).length, est=open.filter(t=>t.est).length;
  $("#stat").innerHTML=`<span class="${over?"c":""}"><b>${over}</b> overdue</span><span><b>${tod}</b> due today</span><span><b>${wk}</b> due this week</span><span><b>${est}</b> suggested dates to confirm</span>`;

  // people
  const ps=people();if(person!=="all"&&person!=="__none"&&person!=="__me"&&!ps.some(n=>norm(n)===norm(person)))person="all";
  if(person==="__me"&&!myName())person="all";
  $("#personSel").innerHTML=`<option value="all">Everyone</option>${myName()?`<option value="__me">Me (${esc(myName())})</option>`:""}${ps.filter(n=>norm(n)!==norm(myName())).map(n=>`<option>${esc(n)}</option>`).join("")}<option value="__none">Unassigned</option>`;
  $("#personSel").value=person;
  $("#people").innerHTML=ps.map(n=>`<option value="${esc(n)}">`).join("");
  $("#me").innerHTML=me&&me.token?`Signed in as <b>${esc(me.name)}</b><button class="btn ghost" type="button" id="signOut">Sign out</button>`:`<button class="btn" type="button" id="signIn">Sign in to edit</button>`;
  $("#importBtn").hidden=!canWrite;

  // gallery
  document.querySelectorAll("#ptabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.pf===pf));
  const gp=byPri().filter(p=>pf==="all"||projStatus(p)===pf);
  $("#gallery").innerHTML=gp.map(p=>{const ts=p.tasks||[];const left=ts.filter(t=>tstat(t)!=="Done").length;
    const nx=ts.filter(t=>tstat(t)!=="Done").map(t=>({...t,p})).sort(cmp)[0];
    return`<button class="pcard" type="button" data-edit="${esc(p.id)}"><div class="cover" style="background:${hue(p)}"><span class="pr">P${esc(p.priority||"–")}</span><svg viewBox="0 0 64 64" aria-hidden="true">${ICONS[p.icon]||ICONS.spark}</svg></div>
    <div class="pbody"><span class="name">${esc(p.name)}</span><span class="meta">${pill(projStatus(p))}${nx?dueChip(nx):""}${isStale(p)?`<span class="chip idle">Idle ${idleDays(p)}d</span>`:""}</span><span class="left mono">${left}/${ts.length} tasks left · ${(filesBy[p.id]||[]).length} files</span></div></button>`}).join("")
    ||'<div class="empty">No projects here.</div>';

  // focus
  const top=open[0];
  $("#focus").innerHTML=!projects.length?'<span class="tag">Do this now</span><span class="muted">Add a project to get started.</span><span></span>'
    :!top?`<span class="tag">Do this now</span><span>${person==="all"?"Everything open is done.":"Nothing open for this person."}</span><span></span>`
    :`<span class="tag">Do this now</span><div style="display:grid;gap:4px;min-width:0"><span class="t">${esc(top.t)}</span>
      <span class="meta"><span class="proj" style="--sw:${hue(top.p)}">${esc(top.p.name)}</span>${dueChip(top)}${whoChip(top.who)}</span>
      ${open[1]?`<span class="then">Then: ${esc(open[1].t)} · ${esc(open[1].p.name)}</span>`:""}</div>
      ${canWrite?`<button class="btn" type="button" data-done="${esc(top.p.id)}|${esc(top.id)}">Mark done</button>`:"<span></span>"}`;

  // task views
  document.querySelectorAll("#ttabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tv===tv));
  const all=allTasks().filter(t=>projStatus(t.p)!=="Done");
  if(tv==="kanban"){
    $("#tasks").innerHTML=`<div class="kanban">${TSTAT.map(s=>{let list=all.filter(t=>t.st===s).sort(cmp);
      if(s==="Done")list=list.reverse();const lim=expanded[s]?Infinity:8;
      return`<div class="col" data-col="${s}"><div class="col-head">${pill(s)}<span class="muted small mono">${list.length}</span></div>
      ${list.slice(0,lim).map(taskCard).join("")}${list.length>lim?`<button class="btn ghost more" type="button" data-more="${s}">Show ${list.length-lim} more</button>`:""}</div>`}).join("")}</div>
      <p class="muted small">Drag a card to another column to change its status, or click it to edit.</p>`;
  }else if(tv==="day"){
    const b={over:[],today:[],tomorrow:[],week:[],next:[],later:[],nodate:[]};
    open.forEach(t=>{const d=dl(t.due);(d===null?b.nodate:d<0?b.over:d===0?b.today:d===1?b.tomorrow:d<=7?b.week:d<=14?b.next:b.later).push(t)});
    const names={over:"Overdue",today:"Today",tomorrow:"Tomorrow",week:"This week",next:"Next week",later:"Later",nodate:"No date"};
    $("#tasks").innerHTML=Object.keys(names).filter(k=>b[k].length).map(k=>{const lim=(k==="later"&&!expanded.later)?6:Infinity;
      return`<div class="bucket" data-b="${k}"><h3>${names[k]} <span class="muted small mono">${b[k].length}</span></h3>${b[k].slice(0,lim).map(row).join("")}
      ${b[k].length>lim?`<button class="btn ghost" type="button" data-more="later">Show ${b[k].length-lim} more</button>`:""}</div>`}).join("")||'<div class="empty">No open tasks.</div>';
  }else if(tv==="calendar"){
    renderCalendar();
  }else{
    $("#tasks").innerHTML=byPri().map(p=>{const ts=(p.tasks||[]).map(t=>({...t,st:tstat(t),p})).sort((a,b)=>(a.st==="Done")-(b.st==="Done")||(a.due||"9999").localeCompare(b.due||"9999"));
      return`<div><div class="group-head"><span class="pr">P${esc(p.priority||"–")}</span><h3>${esc(p.name)}</h3>${pill(projStatus(p))}</div>${ts.map(row).join("")||'<div class="empty">No tasks.</div>'}</div>`}).join("");
  }

  renderTimeline();
  renderAttention();
  $("#addBtn").hidden=!canWrite;$("#addTaskBtn").hidden=!canWrite;
}
function row(t){return`<div class="row ${t.st==="Done"?"isdone":""}"><input type="checkbox" aria-label="Mark done" data-check="${esc(t.p.id)}|${esc(t.id)}" ${t.st==="Done"?"checked":""} ${canWrite?"":"disabled"}>
  <span class="t" data-task="${esc(t.p.id)}|${esc(t.id)}" tabindex="0">${esc(t.t)}<br><span class="proj" style="--sw:${hue(t.p)}">${esc(t.p.name)}</span></span>
  <span class="right">${whoChip(t.who)}${t.st!=="Not started"&&t.st!=="Done"?pill(t.st):""}${t.est?'<span class="chip est">Suggested</span>':""}${dueChip(t)}</span></div>`}

let calM=(()=>{const d=today0();d.setDate(1);return d})();
function calShift(n){if(n===0){calM=today0();calM.setDate(1)}else calM=new Date(calM.getFullYear(),calM.getMonth()+n,1);render()}
function renderCalendar(){
  const first=new Date(calM);const off=(first.getDay()+6)%7;const start=new Date(first);start.setDate(1-off);
  const last=new Date(calM.getFullYear(),calM.getMonth()+1,0);const cells=Math.ceil((off+last.getDate())/7)*7;
  const byDay={};allTasks().filter(t=>t.due).forEach(t=>(byDay[t.due]=byDay[t.due]||[]).push(t));
  Object.values(byDay).forEach(l=>l.sort((a,b)=>(a.st==="Done")-(b.st==="Done")||(+a.p.priority||99)-(+b.p.priority||99)));
  const tIso=iso(today0());let h="";
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(d=>h+=`<div class="dow">${d}</div>`);
  for(let i=0;i<cells;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=iso(d);const list=byDay[k]||[];const show=list.slice(0,4);
    h+=`<div class="day ${d.getMonth()!==calM.getMonth()?"out":""} ${k===tIso?"today":""}" data-day="${k}" aria-label="${d.toLocaleDateString("en-IN",{day:"numeric",month:"long"})}, ${list.length} tasks"><span class="dn">${d.getDate()}</span>
      ${show.map(t=>`<button type="button" class="ev ${t.st==="Done"?"done":""} ${t.est?"est":""}" style="--sw:${hue(t.p)}" data-task="${esc(t.p.id)}|${esc(t.id)}" title="${esc(t.t)} · ${esc(t.p.name)}">${esc(t.t)}</button>`).join("")}
      ${list.length>4?`<span class="more">+${list.length-4} more</span>`:""}</div>`}
  $("#tasks").innerHTML=`<div class="cal-bar"><button class="btn" type="button" data-cal="-1" aria-label="Previous month">‹</button><button class="btn" type="button" data-cal="0">Today</button><button class="btn" type="button" data-cal="1" aria-label="Next month">›</button>
    <h3>${calM.toLocaleDateString("en-IN",{month:"long",year:"numeric"})}</h3><span class="muted small">Colours match each project. ${canWrite?"Click an empty space on a day to add a task.":""}</span></div>
    <div class="cal-scroll"><div class="cal">${h}</div></div>`;
}

let qIdx=Math.floor(today0()/864e5);
function renderQuote(){const q=QUOTES[((qIdx%QUOTES.length)+QUOTES.length)%QUOTES.length];
  $("#quote").innerHTML=`<span class="mark" aria-hidden="true">“</span><div><blockquote>${esc(q[0])}</blockquote><figcaption>${esc(q[1])}</figcaption></div><button class="btn ghost" type="button" id="qNext">Another quote</button>`}

function renderTimeline(){
  const start=today0();start.setDate(start.getDate()-3);const N=49;const days=[];
  for(let i=0;i<N;i++){const d=new Date(start);d.setDate(d.getDate()+i);days.push(d)}
  const col=`grid-template-columns:repeat(${N},1fr)`;const ti=3;
  let months=[];days.forEach((d,i)=>{const m=d.toLocaleDateString("en-IN",{month:"long"});if(!months.length||months[months.length-1].m!==m)months.push({m,s:i,n:1});else months[months.length-1].n++});
  let h=`<div class="tl-months" style="${col}">${months.map(m=>`<div style="grid-column:${m.s+1}/span ${m.n};padding-left:6px">${m.m}</div>`).join("")}</div>
  <div class="tl-days" style="${col}">${days.map((d,i)=>`<div class="${i===ti?"now":d.getDay()===1?"wk":""}">${d.getDate()}</div>`).join("")}</div>
  <div class="tl-body"><div class="tl-grid" style="${col}">${days.map((d,i)=>`<div class="${i===ti?"now":(d.getDay()===0||d.getDay()===6)?"we":""}"></div>`).join("")}</div>`;
  const pos=s=>{const d=dl(s);return d===null?null:d+ti};
  byPri().filter(p=>projStatus(p)!=="Done").forEach(p=>{
    const open=(p.tasks||[]).filter(t=>tstat(t)!=="Done");const dated=open.filter(t=>t.due);
    if(!dated.length){h+=`<div class="tl-row"></div>`;return}
    const ps=dated.map(t=>pos(t.due));const s0=Math.max(0,Math.min(ti,...ps));const e0=Math.max(...ps);const e=Math.min(N-1,e0);
    const L=s0/N*100,W=Math.max((e-s0+1)/N*100,8);
    h+=`<div class="tl-row"><button class="tl-bar" type="button" data-edit="${esc(p.id)}" style="left:${L}%;width:${W}%" title="${esc(p.name)}">
      <span class="sw" style="background:${hue(p)}"></span>${esc(p.name)} ${pill(projStatus(p))}<span class="muted small mono">${open.length} tasks left${e0>N-1?" →":""}</span></button>
      ${dated.filter(t=>pos(t.due)<=N-1).map(t=>`<span class="tl-tick ${dl(t.due)<0?"crit":""}" style="left:${(Math.max(0,pos(t.due))+.5)/N*100}%" title="${esc(t.t)} · ${esc(fmt(t.due))}"></span>`).join("")}</div>`});
  h+='</div>';
  $("#timeline").innerHTML=h;
}

async function setTask(pid,tid,patch,proofed){
  const p=projects.find(x=>x.id===pid);if(!p)return;const cur=(p.tasks||[]).find(t=>t.id===tid);if(!cur)return;
  if(patch.status==="Done"&&tstat(cur)!=="Done"&&!proofed){
    const rest={...patch};delete rest.status;delete rest.done;
    if(Object.keys(rest).some(k=>rest[k]!==cur[k]))await setTask(pid,tid,rest,true);
    proofDialog(pid,tid);return"proof";
  }
  const now=new Date().toISOString();
  const tasks=(p.tasks||[]).map(t=>{if(t.id!==tid)return t;const n={...t,...patch};n.done=tstat(n)==="Done";if(n.done&&!t.done){n.doneAt=now;delete n.logHidden}if(!n.done)delete n.doneAt;return n});
  const body={tasks,updatedAt:now};if(patch.status==="Done")body.lastWorkAt=now;
  await safe(()=>db.doc("projects/"+pid).update(body),patch.status==="Done"?"Done. Work logged.":"Updated");
}

const BOARD_URL=location.origin+location.pathname;
let hashOpened=false;
function openFromHash(){const h=(location.hash||"").slice(1);if(h&&projects.find(x=>x.id===h)){openProject(h);return true}return false}
window.addEventListener("hashchange",openFromHash);
const TRACK_START="2026-10-23T00:00:00Z";
function lastWork(p){let m=p.lastWorkAt||TRACK_START;(filesBy[p.id]||[]).forEach(f=>{if(f.addedAt>m)m=f.addedAt});(p.tasks||[]).forEach(t=>{if(t.doneAt&&!t.logHidden&&t.doneAt>m)m=t.doneAt});return m}
const remindAfter=p=>+p.remindAfter||((+p.priority||99)<=4?4:7);
const idleDays=p=>Math.floor((today0()-new Date(new Date(lastWork(p)).setHours(0,0,0,0)))/864e5);
const isStale=p=>projStatus(p)!=="Done"&&projStatus(p)!=="Waiting"&&idleDays(p)>=remindAfter(p);
function proofDialog(pid,tid){
  const p=projects.find(x=>x.id===pid);const t=(p.tasks||[]).find(x=>x.id===tid);if(!t)return;
  $("#dlg2").innerHTML=`<div class="scrim" id="scrim2"><form class="sheet narrow" id="proof"><h2>Show the work</h2>
    <p class="muted small" style="margin:0">To mark <strong>${esc(t.t)}</strong> as done, add a link or a document of what was produced. It is saved in the ${esc(p.name)} folder.</p>
    <div class="tabs" role="tablist"><button type="button" role="tab" data-pk="link" aria-selected="true">Add a link</button>${assetsNs?'<button type="button" role="tab" data-pk="file" aria-selected="false">Upload a file</button>':""}</div>
    <div id="pk-link" class="field" style="gap:8px"><input id="pf-u" type="url" placeholder="https:// (Drive, Canva, Claude, Instagram post, YouTube video…)" aria-label="Link"><input id="pf-n" placeholder="Title (optional)" aria-label="Title"></div>
    <div id="pk-file" class="field" hidden><input id="pf-f" type="file" aria-label="File"><span class="muted small">PDF, image, video, CSV or text, up to 20 MB.</span></div>
    <div class="field"><label class="lbl" for="pf-note">What was done (optional)</label><textarea id="pf-note" rows="2"></textarea></div>

      <div class="field"><label class="lbl" for="f-status">Status</label><select id="f-status" ${dis}>${PSTAT.map(s=>`<option ${s===projStatus(p)?"selected":""}>${s}</option>`).join("")}</select></div>

      ${canWrite?'<button type="button" class="btn" id="addRow" style="justify-self:start">+ Add task</button>':""}</div>
    <div class="field"><label class="lbl" for="f-notes">Notes</label><textarea id="f-notes" ${dis}>${esc(p.notes)}</textarea></div>
    <div class="sheet-foot"><div>${!isNew&&canWrite?'<button type="button" class="btn danger" id="delP">Delete project</button>':""}</div>
    <div class="actions"><button type="button" class="btn" id="cancel">${canWrite?"Cancel":"Close"}</button>${canWrite?'<button class="btn primary" type="submit">Save</button>':""}</div></div></form></div>`;
  showDlg();
  const sync=()=>document.querySelectorAll("#tlist .trow").forEach(r=>{const t=tasks[+r.dataset.i];const nd=r.querySelector('[data-f="due"]').value;if(nd!==(t.due||""))t.est=false;t.due=nd;t.t=r.querySelector('[data-f="t"]').value;t.status=r.querySelector('[data-f="status"]').value;t.who=r.querySelector('[data-f="who"]').value.trim()});
  const ar=$("#addRow");if(ar)ar.onclick=()=>{sync();tasks.push({id:rid(),t:"",due:"",status:"Not started"});$("#tlist").innerHTML=rows();const a=document.querySelectorAll('#tlist [data-f="t"]');a[a.length-1].focus()};
  $("#tlist").onclick=e=>{const b=e.target.closest("[data-rm]");if(b){sync();tasks.splice(+b.dataset.rm,1);$("#tlist").innerHTML=rows()}};
  const dp=$("#delP");if(dp)dp.onclick=async()=>{if(!dp.dataset.armed){dp.dataset.armed=1;dp.textContent="Tap again to delete";return}await safe(()=>db.doc("projects/"+p.id).delete(),"Project deleted");closeDlg()};
  $("#form").onsubmit=async e=>{e.preventDefault();sync();
    const body={name:$("#f-name").value.trim(),priority:+$("#f-pri").value||99,status:$("#f-status").value,owner:$("#f-owner").value.trim(),notes:$("#f-notes").value.trim(),icon:p.icon||"spark",
      tasks:tasks.filter(t=>t.t.trim()).map(t=>({id:t.id||rid(),t:t.t.trim(),due:t.due||"",status:t.status,done:t.status==="Done",est:!!t.est,who:t.who||"",...(t.note?{note:t.note}:{})})),updatedAt:new Date().toISOString()};
    if(!body.name)return;const ref=isNew?db.collection("projects").doc():db.doc("projects/"+p.id);
    await safe(()=>ref.set(body),"Saved");closeDlg()};
}
function showDlg(){$("#dlg").hidden=false;$("#cancel").onclick=closeDlg;$("#scrim").onclick=e=>{if(e.target.id==="scrim")closeDlg()};const f=$("#dlg input:not([disabled])");if(f)f.focus()}

document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#dlg2").hidden)closeDlg2();else if(openP)closeProject();else if(!$("#dlg").hidden)closeDlg()}
  if(e.key==="Enter"&&e.target.matches(".row .t")){const[p,t]=e.target.dataset.task.split("|");taskEditor(p,t)}});

async function safe(fn,msg){
  if(!db){toast("The board is still loading. Try again in a moment.");return}
  try{await fn();toast(msg)}catch(e){
    if(e&&e.code==="invalid_argument"){toast("Sign in to make changes.");signInDialog()}
    else if(e&&e.code==="quota_exceeded")toast("The board is full. Delete finished projects to add more.");
    else toast("Couldn't save. Check your connection and try again.")}
}

/* ---------- shared board: priority/data.json in the GitHub repo ---------- */
// Everyone reads the same file. Signed-in editors save through the GitHub API: each change is
// kept as an operation, replayed on the latest copy of the file and committed with their name,
// so two people editing at once don't overwrite each other.
const GH={owner:"dikshabhargava31-ops",repo:"claude-and-db",branch:"main",path:"priority/data.json"};
const API=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
const KEY="ipa-priority-board-v2",AUTH_KEY="ipa-priority-board-user";
let me=null;try{me=JSON.parse(localStorage.getItem(AUTH_KEY)||"null")}catch(_){}
canWrite=!!(me&&me.token);
function myName(){return me&&me.name||""}
let shared=null,sha=null,pending=[],store=null,lastSync=null,flushing=false,flushTimer=null,savedCount=0,syncState="";
const subs=new Set();
const DEL={__del:1};
const validBoard=d=>d&&Array.isArray(d.projects)&&d.projects.every(p=>p&&p.id&&p.name);
const normalize=d=>{d.projects=d.projects||[];d.files=d.files||{};return d};
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);

function patchObj(o,p){for(const k in p){if(p[k]&&p[k].__del)delete o[k];else o[k]=structuredClone(p[k])}}
function diff(a,b){const p={};for(const k in b)if(!same(a[k],b[k]))p[k]=b[k];for(const k in a)if(!(k in b))p[k]=DEL;return p}
function applyOp(d,o){
  const p=o.pid&&d.projects.find(x=>x.id===o.pid);
  if(o.k==="all"){d.projects=structuredClone(o.data.projects);d.files=structuredClone(o.data.files||{})}
  else if(o.k==="pset"){const n={...structuredClone(o.doc),id:o.pid};const i=d.projects.findIndex(x=>x.id===o.pid);if(i<0)d.projects.push(n);else d.projects[i]=n}
  else if(o.k==="pdel"){d.projects=d.projects.filter(x=>x.id!==o.pid);delete d.files[o.pid]}
  else if(!p)return;
  else if(o.k==="pupd")patchObj(p,o.patch);
  else if(o.k==="tadd"){p.tasks=p.tasks||[];if(!p.tasks.some(t=>t.id===o.task.id))p.tasks.push(structuredClone(o.task))}
  else if(o.k==="tdel")p.tasks=(p.tasks||[]).filter(t=>t.id!==o.tid);
  else if(o.k==="tupd"){const t=(p.tasks||[]).find(t=>t.id===o.tid);if(t)patchObj(t,o.patch)}
  else if(o.k==="fadd"){const l=d.files[o.pid]=d.files[o.pid]||[];if(!l.some(f=>f.id===o.doc.id))l.push(structuredClone(o.doc))}
  else if(o.k==="fdel"&&d.files[o.pid])d.files[o.pid]=d.files[o.pid].filter(f=>f.id!==o.fid);
}
function rebuild(){store=normalize(structuredClone(shared));pending.forEach(o=>applyOp(store,o));
  try{localStorage.setItem(KEY,JSON.stringify({shared,sha,pending}))}catch(_){}
  subs.forEach(f=>f());showSync()}

function taskOps(pid,oldTs,newTs){
  const ops=[],by=myName(),now=new Date().toISOString(),om=new Map(oldTs.map(t=>[t.id,t])),keep=new Set(newTs.map(t=>t.id));
  oldTs.forEach(t=>{if(!keep.has(t.id))ops.push({k:"tdel",pid,tid:t.id,desc:`deleted task “${t.t}”`})});
  newTs.forEach(t=>{const o=om.get(t.id);
    if(!o){ops.push({k:"tadd",pid,task:{...t,createdBy:by,createdAt:now,...(t.doneAt?{doneBy:by}:{})},desc:`added task “${t.t}”`});return}
    const p=diff(o,t);if(!Object.keys(p).length)return;
    if(p.doneAt)p.doneBy=p.doneAt.__del?DEL:by;
    const desc=p.logHidden?`removed “${o.t}” from the work log`:p.status&&p.status!==tstat(o)?`moved “${o.t}” to ${p.status}`:p.who!==undefined&&!p.who.__del&&p.who!==(o.who||"")?`assigned “${o.t}” to ${p.who||"nobody"}`:`edited task “${o.t}”`;
    Object.assign(p,{updatedBy:by,updatedAt:now});
    ops.push({k:"tupd",pid,tid:t.id,patch:p,desc})});
  return ops}
function queue(ops){if(!ops.length)return;const at=new Date().toISOString();ops.forEach(o=>{o.by=myName();o.at=at;pending.push(o)});rebuild();scheduleFlush()}
function need(){if(!canWrite||!me)throw Object.assign(new Error("Sign in to edit"),{code:"invalid_argument"})}
const sharedDb={
  doc(path){const s=path.split("/");return{
    async update(b){need();const p=store.projects.find(x=>x.id===s[1]);if(!p||s.length!==2)throw new Error("missing");
      const{tasks,...rest}=b;const ops=tasks?taskOps(s[1],p.tasks||[],tasks):[];
      const pp={};for(const k in rest)if(!same(p[k],rest[k]))pp[k]=rest[k];
      const real=Object.keys(pp).filter(k=>k!=="updatedAt"&&k!=="lastWorkAt");
      if(real.length||ops.length){pp.updatedBy=myName();ops.push({k:"pupd",pid:s[1],patch:pp,desc:real.length?`edited ${real.join(", ")} of “${p.name}”`:""})}
      queue(ops)},
    async set(b){need();if(store.projects.some(x=>x.id===s[1]))return this.update(b);
      queue([{k:"pset",pid:s[1],doc:{...b,createdBy:myName(),createdAt:new Date().toISOString()},desc:`added project “${b.name}”`}])},
    async delete(){need();if(s.length===2){const p=store.projects.find(x=>x.id===s[1]);queue([{k:"pdel",pid:s[1],desc:`deleted project “${p?p.name:s[1]}”`}])}
      else{const f=(store.files[s[1]]||[]).find(x=>x.id===s[3]);queue([{k:"fdel",pid:s[1],fid:s[3],desc:`deleted “${f?f.name:s[3]}” from the work log`}])}}}},
  collection(path){const s=path.split("/");return{
    doc(){return sharedDb.doc(path+"/"+rid())},
    async add(b){need();const id=rid();queue([{k:"fadd",pid:s[1],doc:{...b,id,addedBy:myName()},desc:`added ${b.taskName?"work for “"+b.taskName+"”":"link “"+b.name+"”"}`}]);return{id}},
    onSnapshot(cb){const f=()=>cb({docs:(s.length===1?store.projects:(store.files[s[1]]||[])).map(x=>({id:x.id,data:()=>{const{id,...r}=structuredClone(x);return r}}))});subs.add(f);f();return()=>subs.delete(f)}}}
};

/* ---------- GitHub reads and writes ---------- */
function b64enc(str){const b=new TextEncoder().encode(str);let o="";for(let i=0;i<b.length;i+=32768)o+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(o)}
function b64dec(str){const bin=atob(str.replace(/\s/g,""));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
const ghHeaders=()=>({Accept:"application/vnd.github+json",...(me&&me.token?{Authorization:"Bearer "+me.token}:{})});
async function readRemote(){
  if(me&&me.token){const r=await fetch(`${API}?ref=${GH.branch}&t=${Date.now()}`,{cache:"no-store",headers:ghHeaders()});
    if(r.ok){const j=await r.json();const d=JSON.parse(b64dec(j.content));if(validBoard(d))return{data:normalize(d),sha:j.sha}}
    else if(r.status!==404)throw Object.assign(new Error("read"),{status:r.status})}
  // Viewers (and the first save, before the file is on main): the raw file, then the copy published with the site.
  for(const u of[`https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/${GH.branch}/${GH.path}?t=${Date.now()}`,`data.json?t=${Date.now()}`]){
    try{const r=await fetch(u,{cache:"no-store"});if(r.ok){const d=await r.json();if(validBoard(d))return{data:normalize(d),sha:null}}}catch(_){}}
  throw new Error("read")}
function commitMsg(batch){const ds=batch.map(o=>o.desc).filter(Boolean);const who=batch[0].by||"Someone";
  return`Board: ${who} ${ds[0]||"updated the board"}${ds.length>1?` (+${ds.length-1} more)`:""}`}
function scheduleFlush(ms){clearTimeout(flushTimer);flushTimer=setTimeout(flush,ms??1000)}
async function flush(){
  if(flushing||!pending.length||!me||!me.token)return;flushing=true;setSync("saving");
  const batch=pending.slice();
  try{
    for(let tries=0;tries<4;tries++){
      const rem=await readRemote();
      const next=normalize(structuredClone(rem.data||shared));batch.forEach(o=>applyOp(next,o));
      next.version=1;next.exportedAt=new Date().toISOString();
      const r=await fetch(API,{method:"PUT",headers:{...ghHeaders(),"Content-Type":"application/json"},
        body:JSON.stringify({message:commitMsg(batch),content:b64enc(JSON.stringify(next,null,2)+"\n"),branch:GH.branch,...(rem.sha?{sha:rem.sha}:{})})});
      if(r.status===409||r.status===422)continue; // someone saved first: re-read and replay
      if(r.status===401||r.status===403||r.status===404){setSync("auth");toast("GitHub didn't accept the save. Sign in again with a token that can write to this repository.",8000);return}
      if(!r.ok)throw new Error(r.status);
      const j=await r.json();shared=next;sha=j.content.sha;savedCount++;
      pending=pending.filter(o=>!batch.includes(o));lastSync=new Date();setSync("ok");rebuild();
      if(pending.length)scheduleFlush(300);return}
    throw new Error("conflict")}
  catch(_){setSync("error");scheduleFlush(30000)}
  finally{flushing=false}
}
async function pull(){
  if(flushing||document.hidden||!shared)return;const seen=savedCount;
  try{const rem=await readRemote();if(flushing||seen!==savedCount||!rem.data)return;
    if((rem.data.exportedAt||"")<(shared.exportedAt||""))return; // a cached copy older than what we have
    lastSync=new Date();if(rem.sha)sha=rem.sha;
    if(!same(rem.data,shared)){shared=rem.data;rebuild()}else showSync();
    if(syncState==="offline")setSync(pending.length?"error":"ok")}
  catch(_){setSync("offline")}
}
function setSync(s){syncState=s;showSync()}
function showSync(){const el=$("#sync");if(!el)return;const n=pending.length;
  const t=lastSync?lastSync.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}):"";
  const[cls,msg]=syncState==="saving"?["saving","Saving…"]
    :syncState==="error"?["bad",`Couldn't save ${n} change${n===1?"":"s"}. Retrying shortly.`]
    :syncState==="auth"?["bad",`${n} change${n===1?"":"s"} not saved. Sign in again.`]
    :syncState==="offline"?["bad","Offline. Showing the last copy loaded."]
    :n&&!canWrite?["bad",`${n} change${n===1?"":"s"} not saved. Sign in to save them.`]
    :["ok",`${canWrite?"All changes saved":"View only"}${t?" · updated "+t:""}`];
  el.className="sync "+cls;el.textContent=msg}

/* ---------- sign in ---------- */
function signInDialog(){
  $("#dlg2").innerHTML=`<div class="scrim" id="scrim2"><form class="sheet narrow" id="signin"><h2>Sign in to edit</h2>
    <p class="muted small" style="margin:0">Your name is shown on tasks you're assigned, tasks you finish and work you log. Saving needs a GitHub access token for this repository. It stays in this browser only.</p>
    <div class="field"><label class="lbl" for="si-n">Your name</label><input id="si-n" required value="${esc(me&&me.name)}" autocomplete="name" placeholder="e.g. Diksha"></div>
    <div class="field"><label class="lbl" for="si-t">GitHub access token</label><input id="si-t" type="password" required value="${esc(me&&me.token)}" autocomplete="off" placeholder="github_pat_…">
      <span class="muted small">Create a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">fine-grained token</a> for only <span class="mono">${GH.owner}/${GH.repo}</span>, with <b>Contents: Read and write</b>. You need to be a collaborator on the repository.</span></div>
    <div class="sheet-foot"><span></span><div class="actions"><button type="button" class="btn" id="cancel2">Cancel</button><button class="btn primary" type="submit">Sign in</button></div></div></form></div>`;
  showDlg2();
  $("#signin").onsubmit=async e=>{e.preventDefault();const name=$("#si-n").value.trim(),token=$("#si-t").value.trim();if(!name||!token)return;
    toast("Checking access…",15000);
    try{const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}`,{cache:"no-store",headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+token}});
      if(r.status===401){toast("GitHub didn't accept that token.",6000);return}
      if(!r.ok)throw 0;const j=await r.json();
      if(!(j.permissions&&j.permissions.push)){toast("That account can't save to this repository. Ask the owner to add you as a collaborator.",8000);return}}
    catch(_){toast("Couldn't reach GitHub. Check your connection.",6000);return}
    me={name,token};try{localStorage.setItem(AUTH_KEY,JSON.stringify(me))}catch(_){}
    canWrite=true;closeDlg2();setSync("ok");render();refreshPanel(true);toast("Signed in as "+name);flush();pull()};
}
function signOut(){me=null;canWrite=false;try{localStorage.removeItem(AUTH_KEY)}catch(_){}if(person==="__me")person="all";setSync("ok");render();refreshPanel(true);toast("Signed out")}

/* ---------- backup ---------- */
function exportBoard(){const d={version:1,exportedAt:new Date().toISOString(),projects:store.projects,files:store.files};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.download="ipa-priority-board-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("Backup downloaded.")}
$("#exportBtn").onclick=()=>store&&exportBoard();
$("#importBtn").onclick=()=>$("#importIn").click();
$("#importIn").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;let d;
  try{d=JSON.parse(await f.text());if(!validBoard(d))throw 0}catch(_){toast("That file isn't a board backup.");return}
  if(!confirm(`Replace the board for everyone with this backup (${d.projects.length} projects)?`))return;
  try{need();queue([{k:"all",data:{projects:d.projects,files:d.files||{}},desc:"restored the board from a backup"}]);toast("Restoring the backup…")}catch(_){signInDialog()}};
$("#histLink").href=`https://github.com/${GH.owner}/${GH.repo}/commits/${GH.branch}/${GH.path}`;

(async()=>{
  let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||"null")}catch(_){}
  if(saved&&validBoard(saved.shared)){shared=normalize(saved.shared);sha=saved.sha||null;pending=Array.isArray(saved.pending)?saved.pending:[]}
  db=sharedDb;
  const start=()=>{rebuild();db.collection("projects").onSnapshot(snap=>{projects=snap.docs.map(d=>({id:d.id,...d.data()}));syncFileSubs();render();refreshPanel();if(!hashOpened&&projects.length){hashOpened=true;openFromHash()}})};
  if(shared)start();
  try{const rem=await readRemote();if(!shared||(rem.data.exportedAt||"")>=(shared.exportedAt||"")){shared=rem.data;sha=rem.sha}lastSync=new Date();setSync("ok")}
  catch(_){setSync("offline")}
  if(!shared){$("#focus").innerHTML='<span class="tag">Do this now</span><span class="muted">Couldn\'t load the board. Check your connection and reload.</span><span></span>';return}
  if(!projects.length&&!subs.size)start();else rebuild();
  if(pending.length)flush();
  setInterval(pull,canWrite?30000:90000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
})();
</script>
