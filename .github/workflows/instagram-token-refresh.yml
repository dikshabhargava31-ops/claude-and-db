name: Instagram token refresh

# Instagram tokens last 60 days. This renews them every Monday and saves them back into
# IG_ACCOUNTS and the IG_ACCOUNT_<NAME> secrets, which needs a GH_PAT secret allowed to edit secrets.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Renew tokens
        env:
          IG_ACCOUNTS: ${{ secrets.IG_ACCOUNTS }}
          IG_SECRETS: ${{ toJSON(secrets) }}
        run: python3 instagram/ig_scheduler.py refresh-tokens --out-dir "$RUNNER_TEMP/renewed"

      - name: Save renewed tokens
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          [ -n "$(ls -A "$RUNNER_TEMP/renewed" 2>/dev/null)" ] || exit 0
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add a GH_PAT secret (see instagram/README.md) so renewed tokens can be saved."
            exit 1
          fi
          for f in "$RUNNER_TEMP/renewed"/*; do
            gh secret set "$(basename "$f")" --repo "$GITHUB_REPOSITORY" < "$f"
          done
          rm -r "$RUNNER_TEMP/renewed"
