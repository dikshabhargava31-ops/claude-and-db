name: Instagram scheduler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would be posted"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-scheduler
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Publish due posts
        env:
          IG_ACCOUNTS: ${{ secrets.IG_ACCOUNTS }}
        run: python3 instagram/ig_scheduler.py run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save what was published
        if: always()
        run: |
          git diff --quiet instagram/published.json && exit 0
          git config user.name "instagram-scheduler"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram/published.json
          git commit -m "Instagram: record published posts"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
