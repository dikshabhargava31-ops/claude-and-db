name: Instagram scheduler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "publish: post what is due. dry-run: only show it. verify: test the accounts. probe: test a media link. verify and probe post nothing."
        type: choice
        options: [publish, dry-run, verify, probe]
        default: publish
      probe_url:
        description: "For probe: the media link to test"
        type: string
        default: ""

permissions:
  contents: write

# One publishing run at a time; a test run (verify, probe, dry-run) never waits behind it.
concurrency:
  group: instagram-${{ inputs.mode || 'publish' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Set the commit author
        run: |
          git config user.name "instagram-scheduler"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish due posts
        env:
          IG_ACCOUNTS: ${{ secrets.IG_ACCOUNTS }}
          IG_SECRETS: ${{ toJSON(secrets) }}
          MODE: ${{ inputs.mode || 'publish' }}
          PROBE_URL: ${{ inputs.probe_url }}
        run: |
          case "$MODE" in
            verify) python3 instagram/ig_scheduler.py verify ;;
            probe) python3 instagram/ig_scheduler.py probe "$PROBE_URL" ;;
            dry-run) python3 instagram/ig_scheduler.py run --dry-run ;;
            *) python3 instagram/ig_scheduler.py run --watch-hours 5.5 --sync ;;
          esac

      - name: Save what was published
        if: always()
        run: |
          git diff --quiet instagram/published.json && exit 0
          git add instagram/published.json
          git commit -m "Instagram: record published posts"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
