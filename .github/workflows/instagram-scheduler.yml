name: Instagram scheduler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "publish: post what is due. dry-run: only show it. verify: test the accounts. probe: test a media link. verify and probe post nothing."
        type: choice
        options: [publish, dry-run, verify, probe, media-url]
        default: publish
      probe_url:
        description: "For probe: the media link to test. For media-url: the account short name and media id"
        type: string
        default: ""

permissions:
  contents: write

# One publishing run at a time; a test run (verify, probe, dry-run) never waits behind it.
concurrency:
  group: instagram-${{ inputs.mode || 'publish' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Make sure ffmpeg is installed
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Set the commit author
        run: |
          git config user.name "instagram-scheduler"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish due posts
        env:
          IG_ACCOUNTS: ${{ secrets.IG_ACCOUNTS }}
          IG_ACCOUNT_1: ${{ secrets.IG_ACCOUNT_1 }}
          IG_ACCOUNT_2: ${{ secrets.IG_ACCOUNT_2 }}
          IG_ACCOUNT_3: ${{ secrets.IG_ACCOUNT_3 }}
          IG_ACCOUNT_4: ${{ secrets.IG_ACCOUNT_4 }}
          IG_ACCOUNT_5: ${{ secrets.IG_ACCOUNT_5 }}
          IG_ACCOUNT_6: ${{ secrets.IG_ACCOUNT_6 }}
          IG_ACCOUNT_7: ${{ secrets.IG_ACCOUNT_7 }}
          IG_ACCOUNT_8: ${{ secrets.IG_ACCOUNT_8 }}
          IG_ACCOUNT_9: ${{ secrets.IG_ACCOUNT_9 }}
          IG_ACCOUNT_10: ${{ secrets.IG_ACCOUNT_10 }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'publish' }}
          PROBE_URL: ${{ inputs.probe_url }}
        run: |
          case "$MODE" in
            verify) python3 instagram/ig_scheduler.py verify ;;
            probe) python3 instagram/ig_scheduler.py probe "$PROBE_URL" ;;
            media-url) python3 instagram/ig_scheduler.py media-url $PROBE_URL ;;
            dry-run) python3 instagram/ig_scheduler.py run --dry-run ;;
            *) python3 instagram/ig_scheduler.py run --watch-hours 5.5 --sync ;;
          esac

      - name: Save what was published
        if: always()
        run: python3 instagram/ig_scheduler.py sync
