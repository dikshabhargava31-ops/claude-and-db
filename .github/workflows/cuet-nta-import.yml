name: CUET NTA universities import

# Refreshes cuet/data/universities.json from NTA's official participating-universities list.
# Manual only: the list on the site comes from the official-data workbook, so a run replaces it only when asked.
on:
  workflow_dispatch:
    inputs:
      year:
        description: "CUET (UG) cycle the list belongs to"
        type: string
        default: "2026"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the PDF reader
        run: pip install pdfplumber

      - name: Import NTA's list
        run: python3 cuet/scripts/import_nta.py --year "${{ inputs.year || '2026' }}"

      - name: Save the list
        run: |
          git diff --quiet -I '"importedAt"' cuet/data/universities.json && exit 0
          git config user.name "cuet-nta-import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cuet/data/universities.json
          git commit -m "Everything CUET: refresh NTA participating universities"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
