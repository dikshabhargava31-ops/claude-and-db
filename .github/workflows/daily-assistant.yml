name: Daily assistant

# Plans the day from the IPA Priority Board and sends it to Gmail and your laptop (assistant/README.md).
# Monday to Saturday, India time: 08:42 to-do list, 13:17 nudge, 18:47 wrap-up.
# Secrets: BOARD_TOKEN; GMAIL_ADDRESS + GMAIL_APP_PASSWORD and/or NTFY_TOPIC; ANTHROPIC_API_KEY is optional.
# This repository is public, so the run log only prints counts, never task names.
on:
  # Paused on 27 Nov 2026 at Diksha's request: no scheduled runs. Run it by hand from Actions if needed.
  workflow_dispatch:
    inputs:
      mode:
        description: "Which message to send now (resend: this morning's list again, without re-planning)"
        type: choice
        options: [morning, midday, evening, resend, coach]
        default: morning
      once:
        description: "Skip if this message already went out today (used by the timed starts)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-assistant
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pick the message
        id: mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.mode }}
          ONCE: ${{ inputs.once }}
        run: |
          case "$SCHEDULE" in
            "12 3 "*|"37 3 "*|"4 4 "*) mode=morning ;;
            "47 7 "*|"17 8 "*) mode=midday ;;
            "17 13 "*|"47 13 "*|"17 14 "*) mode=evening ;;
            *) mode="${INPUT:-morning}" ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ -n "$SCHEDULE" ] || [ "$ONCE" = "true" ]; then echo "once=--once" >> "$GITHUB_OUTPUT"; else echo "once=" >> "$GITHUB_OUTPUT"; fi

      - name: Install the Anthropic SDK
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        if: contains(fromJSON('["morning","evening","coach"]'), steps.mode.outputs.mode)
        run: '[ -z "$ANTHROPIC_API_KEY" ] || pip install -q "anthropic>=1.1"'

      - name: Send
        env:
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python3 assistant/daily_assistant.py "${{ steps.mode.outputs.mode }}" ${{ steps.mode.outputs.once }}
