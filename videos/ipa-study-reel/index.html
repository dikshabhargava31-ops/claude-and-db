<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"hook-small","type":"string","label":"Hook, small line","default":"pov: it&apos;s 3:51 pm at"},
    {"id":"hook-big","type":"string","label":"Hook, big line","default":"IPA"},
    {"id":"end-small","type":"string","label":"End, small line","default":"built one hour at a time."},
    {"id":"end-big","type":"string","label":"End, big line","default":"IPA INSTITUTE"},
    {"id":"end-place","type":"string","label":"End, place","default":"AJMER"},
    {"id":"accent","type":"color","label":"Accent","default":"#FFD21F"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b1430;
        --ink: #ffffff;
        --accent: #ffd21f;
        --font-display: "Archivo Black", sans-serif;
        --font-serif: "EB Garamond", serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ground);
      }
      .shot {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #scrim {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 900px;
        z-index: 20;
        background: linear-gradient(
          to bottom,
          rgba(5, 10, 30, 0.72) 0%,
          rgba(5, 10, 30, 0.45) 45%,
          rgba(5, 10, 30, 0) 100%
        );
      }
      .cap {
        position: absolute;
        left: 0;
        top: 250px;
        width: 1080px;
        z-index: 30;
        text-align: center;
        color: var(--ink);
      }
      .cap .line {
        display: block;
        overflow: visible;
      }
      .cap .small {
        font-family: var(--font-serif);
        font-style: italic;
        font-size: 64px;
        line-height: 1.1;
        color: var(--accent);
      }
      .cap .big {
        font-family: var(--font-display);
        font-size: 132px;
        line-height: 1.02;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.35);
      }
      #cap-hook .big {
        font-size: 230px;
        color: var(--accent);
      }
      #endcard {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        z-index: 25;
        background: linear-gradient(
          to bottom,
          rgba(8, 14, 40, 0) 30%,
          rgba(8, 14, 40, 0.55) 55%,
          rgba(8, 14, 40, 0.88) 100%
        );
      }
      #cap-end {
        top: 1000px;
      }
      #cap-end .big {
        font-size: 120px;
      }
      #cap-end .place {
        font-family: var(--font-display);
        font-size: 40px;
        letter-spacing: 0.5em;
        margin-top: 18px;
        color: var(--accent);
      }
      #rule {
        display: block;
        width: 160px;
        height: 6px;
        margin: 26px auto 0;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15.5"
      data-width="1080"
      data-height="1920"
    >
      <!-- Footage: cuts on a 120 bpm grid (0.5 s beats) -->
      <video id="v01" class="clip shot" src="raw/shots/s01.mp4" data-start="0" data-duration="2" data-track-index="1" muted playsinline></video>
      <video id="v02" class="clip shot" src="raw/shots/s02.mp4" data-start="2" data-duration="1" data-track-index="1" muted playsinline></video>
      <video id="v03" class="clip shot" src="raw/shots/s03.mp4" data-start="3" data-duration="0.5" data-track-index="1" muted playsinline></video>
      <video id="v04" class="clip shot" src="raw/shots/s04.mp4" data-start="3.5" data-duration="1.5" data-track-index="1" muted playsinline></video>
      <video id="v05" class="clip shot" src="raw/shots/s05.mp4" data-start="5" data-duration="0.75" data-track-index="1" muted playsinline></video>
      <video id="v06" class="clip shot" src="raw/shots/s06.mp4" data-start="5.75" data-duration="0.75" data-track-index="1" muted playsinline></video>
      <video id="v07" class="clip shot" src="raw/shots/s07.mp4" data-start="6.5" data-duration="1.5" data-track-index="1" muted playsinline></video>
      <video id="v08" class="clip shot" src="raw/shots/s08.mp4" data-start="8" data-duration="0.75" data-track-index="1" muted playsinline></video>
      <video id="v09" class="clip shot" src="raw/shots/s09.mp4" data-start="8.75" data-duration="0.75" data-track-index="1" muted playsinline></video>
      <video id="v10" class="clip shot" src="raw/shots/s10.mp4" data-start="9.5" data-duration="1.5" data-track-index="1" muted playsinline></video>
      <video id="v11" class="clip shot" src="raw/shots/s11.mp4" data-start="11" data-duration="0.75" data-track-index="1" muted playsinline></video>
      <video id="v12" class="clip shot" src="raw/shots/s12.mp4" data-start="11.75" data-duration="0.75" data-track-index="1" muted playsinline></video>
      <video id="v13" class="clip shot" src="raw/shots/s13.mp4" data-start="12.5" data-duration="3" data-track-index="1" muted playsinline></video>

      <div id="scrim" class="clip" data-start="0" data-duration="12.5" data-track-index="2"></div>
      <div id="endcard" class="clip" data-start="12.5" data-duration="3" data-track-index="2"></div>

      <!-- Captions: a time stamp in italic serif, the action in heavy caps -->
      <div id="cap-hook" class="cap clip" data-start="0" data-duration="2" data-track-index="3">
        <span class="line small" id="hook-s" data-var-text="hook-small">pov: it's 3:51 pm at</span>
        <span class="line big" id="hook-b" data-var-text="hook-big">IPA</span>
      </div>
      <div id="cap-1" class="cap clip" data-start="2" data-duration="1.5" data-track-index="3">
        <span class="line small">3:52 pm</span><span class="line big">highlight.</span>
      </div>
      <div id="cap-2" class="cap clip" data-start="3.5" data-duration="1.5" data-track-index="3">
        <span class="line small">3:58 pm</span><span class="line big">note it<br />down.</span>
      </div>
      <div id="cap-3" class="cap clip" data-start="5" data-duration="1.5" data-track-index="3">
        <span class="line small">4:01 pm</span><span class="line big">solve.</span>
      </div>
      <div id="cap-4" class="cap clip" data-start="6.5" data-duration="1.5" data-track-index="3">
        <span class="line small">4:05 pm</span><span class="line big">re-read.</span>
      </div>
      <div id="cap-5" class="cap clip" data-start="8" data-duration="1.5" data-track-index="3">
        <span class="line small">4:11 pm</span><span class="line big">breathe.</span>
      </div>
      <div id="cap-6" class="cap clip" data-start="9.5" data-duration="1.5" data-track-index="3">
        <span class="line small">4:12 pm</span><span class="line big">back at it.</span>
      </div>
      <div id="cap-7" class="cap clip" data-start="11" data-duration="1.5" data-track-index="3">
        <span class="line small">4:16 pm</span><span class="line big">repeat.</span>
      </div>
      <div id="cap-end" class="cap clip" data-start="12.5" data-duration="3" data-track-index="3">
        <span class="line small" id="end-s" data-var-text="end-small">built one hour at a time.</span>
        <span class="line big" id="end-b" data-var-text="end-big">IPA INSTITUTE</span>
        <span class="line place" id="end-p" data-var-text="end-place">AJMER</span>
        <span id="rule"></span>
      </div>
    </div>
    <script>
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      if (vars.accent) document.documentElement.style.setProperty("--accent", vars.accent);

      const tl = gsap.timeline({ paused: true });
      const rise = (sel, at, d = 0.32) =>
        tl.fromTo(sel, { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: d, ease: "power3.out" }, at);

      // Hook: on screen at frame 0, the big word pulses on the second beat
      tl.fromTo("#hook-b", { scale: 1 }, { scale: 1.12, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 0.5);

      // Each step: stamp first, action word half a beat after
      [["#cap-1", 2], ["#cap-2", 3.5], ["#cap-3", 5], ["#cap-4", 6.5], ["#cap-5", 8], ["#cap-6", 9.5], ["#cap-7", 11]].forEach(([id, t]) => {
        rise(`${id} .small`, t, 0.25);
        rise(`${id} .big`, t + 0.12, 0.3);
      });

      // End card
      rise("#end-s", 12.75, 0.4);
      rise("#end-b", 13.05, 0.4);
      rise("#end-p", 13.35, 0.4);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, 13.55);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
