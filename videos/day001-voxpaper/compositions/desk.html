  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    // register rows: 15 names, 12 get struck out, 3 survive (illustrative names)
    const names = ["Sneha · 11th", "Kabir · 9th", "Ananya · 10th", "Arjun · 12th", "Isha · 8th", "Dev · 9th", "Meera · 11th", "Kunal · 10th", "Riya · 9th", "Yash · 12th", "Tanvi · 8th", "Vivaan · 10th", "Neha · 9th", "Om · 11th", "Zoya · 10th"];
    const keep = [0, 5, 9];
    const rows = document.getElementById("reg-rows");
    names.forEach((n, k) => {
      const y = 92 + k * 45;
      rows.insertAdjacentHTML("beforeend", '<div class="row hand" style="top:' + y + 'px"><u>' + (k + 1) + '.</u>' + n + '</div>' + (keep.includes(k) ? '<i class="keep" style="top:' + (y + 5) + 'px"></i>' : '<i class="strike" style="top:' + (y + 24) + 'px"></i>'));
    });

    const slap = (sel, t, rot) => tl.fromTo(sel, { opacity: 0, scale: 1.25, rotation: rot - 6 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.22, ease: "back.out(1.7)" }, t);
    const swipe = (sel, t) => tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.inOut" }, t);
    const draw = (sel, t, d) => tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d || 0.4, ease: "power2.inOut" }, t);
    const drop = (sel, t, rot) => tl.fromTo(sel, { opacity: 0, y: -180, rotation: rot * 3, scale: 1.08 }, { opacity: 1, y: 0, rotation: rot, scale: 1, duration: 0.32, ease: "power3.out" }, t);

    // the camera travels across one desk: A (top left) → B (right) → C (down) → D (left)
    const stops = [[0, 0, 0], [3.4, -1080, 0], [5.6, -1080, -1920], [7.9, 0, -1920]];
    stops.forEach(([t, x, y], k) => {
      if (k) {
        tl.to("#world", { x, y, duration: 0.6, ease: "power3.inOut" }, t - 0.3);
        tl.to("#cam", { scale: 0.88, duration: 0.3, ease: "power2.in" }, t - 0.3);
        tl.to("#cam", { scale: 1, duration: 0.3, ease: "power2.out" }, t);
      }
      const next = k + 1 < stops.length ? stops[k + 1][0] - 0.3 : 10.5;
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.035, duration: next - (k ? t + 0.3 : 0), ease: "none", immediateRender: false }, k ? t + 0.3 : 0);
    });

    // A: the register
    tl.set("#reg", { rotation: -1.5 }, 0);
    tl.set("#a1", { rotation: -2 }, 0);
    slap("#a2", 1.7, 1.5); slap("#a3", 2.2, 4);
    tl.set(".strike, .keep", { scaleX: 0 }, 0);
    tl.to(".strike", { scaleX: 1, duration: 0.12, ease: "power2.out", stagger: 0.07 }, 1.95);
    tl.to(".keep", { scaleX: 1, duration: 0.22, ease: "power2.out", stagger: 0.1 }, 2.75);
    tl.set("#a2-hl", { scaleX: 0 }, 0); swipe("#a2-hl", 2.45);
    draw("#a-circle-p", 2.75, 0.4);

    // B: the same reply, photocopied
    slap("#b1", 3.45, -1.5); slap("#b2", 3.8, 1);
    tl.set("#b2-hl", { scaleX: 0 }, 0); swipe("#b2-hl", 4.1);
    drop("#cp1", 3.65, -5); drop("#cp2", 3.95, 4); drop("#cp3", 4.25, -3); drop("#cp4", 4.55, 6);
    tl.fromTo("#b-stamp", { opacity: 0, scale: 2.4, rotation: -20 }, { opacity: 0.9, scale: 1, rotation: -9, duration: 0.24, ease: "power4.in" }, 4.95);

    // C: the call, and the red pen
    slap("#c1", 5.65, -1); slap("#c2", 6.1, 2);
    draw("#c-x-p", 6.75, 0.25);
    tl.fromTo("#c3", { opacity: 0, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "steps(10)" }, 7.05);
    tl.set("#call", { rotation: 3 }, 0);

    // D: three questions pinned on string
    slap("#d1", 7.95, -2); slap("#d2", 8.25, 1);
    tl.set("#d2-hl", { scaleX: 0 }, 0); swipe("#d2-hl", 8.5);
    drop("#q1", 8.7, -2); drop("#q2", 8.95, 1.5); drop("#q3", 9.2, -1);
    ["#p1", "#p2", "#p3"].forEach((p, k) => tl.fromTo(p, { opacity: 0, scale: 2 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)" }, 8.85 + k * 0.25));
    draw("#d-string-p", 9.6, 0.6);
    window.__timelines["desk"] = tl;
