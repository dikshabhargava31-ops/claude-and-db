<!doctype html>
<html lang="hi" data-resolution="portrait"
  data-composition-variables='[{"id":"accent","type":"color","label":"Accent","default":"#FFC93C"},{"id":"ground","type":"color","label":"Background","default":"#0A0F2C"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root { --accent: #FFC93C; --ground: #0A0F2C; --ink: #ffffff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; background: var(--ground); overflow: hidden; }
      #presenter-stage { position: absolute; inset: 0; z-index: 3; }
      #presenter-rig { position: absolute; left: -132px; top: 664px; width: 1320px; height: 1296px; transform-origin: 50% 100%; }
      #presenter { position: absolute; left: 0; top: 0; width: 1320px; height: 1296px; object-fit: contain; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="26.99" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-composition-id="bg" data-composition-src="compositions/bg.html"
        data-start="0" data-duration="26.99" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>

      <div id="presenter-stage">
        <div id="presenter-rig">
          <video id="presenter" class="clip" src="assets/presenter.webm" data-start="0.950" data-media-start="0" data-duration="23.99" data-track-index="1" muted playsinline></video>
        </div>
      </div>

      <div id="graphics" class="clip" data-composition-id="graphics" data-composition-src="compositions/graphics.html"
        data-start="0" data-duration="26.99" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:4"></div>

      <div id="captions" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="26.99" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:5"></div>

      <div id="intro" class="clip" data-composition-id="intro" data-composition-src="compositions/intro.html"
        data-start="0" data-duration="1.900" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:6"></div>

      <div id="outro" class="clip" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="24.19" data-duration="2.8" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:7"></div>

      <audio id="voice" class="clip" src="assets/voice.m4a" data-start="1.5" data-duration="22.99" data-track-index="6" data-volume="1"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0" data-duration="1.4" data-track-index="7" data-volume="0.5"></audio>
      <audio id="sfx-whoosh-in" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="0.900" data-duration="1.2" data-track-index="8" data-volume="0.4"></audio>
      <audio id="sfx-pop-0" class="clip" src="assets/sfx/pop.mp3" data-start="8.360" data-duration="0.6" data-track-index="9" data-volume="0.35"></audio>
      <audio id="sfx-pop-1" class="clip" src="assets/sfx/pop.mp3" data-start="10.920" data-duration="0.6" data-track-index="9" data-volume="0.35"></audio>
      <audio id="sfx-pop-2" class="clip" src="assets/sfx/pop.mp3" data-start="12.360" data-duration="0.6" data-track-index="9" data-volume="0.35"></audio>
      <audio id="sfx-pop-3" class="clip" src="assets/sfx/pop.mp3" data-start="15.160" data-duration="0.6" data-track-index="9" data-volume="0.35"></audio>
      <audio id="sfx-pop-4" class="clip" src="assets/sfx/pop.mp3" data-start="17.640" data-duration="0.6" data-track-index="9" data-volume="0.35"></audio>
      <audio id="sfx-pop-5" class="clip" src="assets/sfx/pop.mp3" data-start="19.000" data-duration="0.6" data-track-index="9" data-volume="0.35"></audio>
      <audio id="sfx-pop-6" class="clip" src="assets/sfx/pop.mp3" data-start="20.680" data-duration="0.6" data-track-index="9" data-volume="0.35"></audio>
      <audio id="sfx-whoosh-out" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="24.34" data-duration="0.57" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-chime" class="clip" src="assets/sfx/chime.mp3" data-start="24.84" data-duration="1.4" data-track-index="11" data-volume="0.3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // presenter rises in under the opener, punches in on emphasis, eases out under the end card
      tl.fromTo("#presenter-rig", { y: 420, scale: 0.92 }, { y: 0, scale: 1, duration: 0.7, ease: "expo.out" }, 0.950);
      tl.to("#presenter-rig", { scale: 1.12, duration: 0.28, ease: "power3.out" }, 6.36);
      tl.to("#presenter-rig", { scale: 1, duration: 0.45, ease: "power2.inOut" }, 8.06);
      tl.to("#presenter-rig", { y: 160, scale: 0.9, opacity: 0, duration: 0.45, ease: "power3.in" }, 24.39);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
