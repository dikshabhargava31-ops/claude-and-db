    <style>
      @font-face {
        font-family: "Noto Color Emoji";
        src: local("Noto Color Emoji");
      }
      :root {
        --ground: #000;
        --ink: #f6f1e7;
        --accent: #f2c14e;
        --font-serif: "Playfair Display", "Noto Color Emoji", serif;
        --font-sans: "Montserrat", "Noto Color Emoji", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; }
      .shot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #shade {
        position: absolute; inset: 0; z-index: 20;
        background: radial-gradient(ellipse 85% 38% at 50% 46%, rgba(0,0,0,0.58) 0%, rgba(0,0,0,0.30) 55%, rgba(0,0,0,0) 100%);
      }
      .card {
        position: absolute; left: 100px; right: 100px; top: 520px; height: 760px; z-index: 30;
        display: flex; align-items: center; justify-content: center; text-align: center;
        color: var(--ink); text-shadow: 0 6px 30px rgba(0,0,0,0.55);
      }
      .inner { display: flex; flex-direction: column; align-items: center; gap: 22px; }
      .serif { font-family: var(--font-serif); font-style: italic; font-weight: 500; font-size: 104px; line-height: 1.05; letter-spacing: -0.01em; }
      .caps { font-family: var(--font-sans); font-weight: 600; font-size: 50px; letter-spacing: 0.14em; text-transform: uppercase; line-height: 1.25; }
      .rule { width: 120px; height: 3px; background: var(--accent); }
      .tile { position: absolute; width: 522px; height: 942px; object-fit: cover; border-radius: 18px; }
      #outro-bg { position: absolute; inset: 0; background: #0b0a09; }
      #card3 .inner { background: rgba(11,10,9,0.72); padding: 56px 70px 64px; border-radius: 28px; }
      #card3 .serif { font-size: 128px; }
      #card3 .caps { font-size: 60px; }
      .hl { color: var(--accent); }
      .big { font-family: var(--font-sans); font-weight: 800; font-size: 150px; letter-spacing: 0.04em; line-height: 1; }
      .emoji { font-size: 110px; line-height: 1; }
    </style>
