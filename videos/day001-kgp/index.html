<!doctype html>
<html lang="hi" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b1226;
      }
      #cam {
        position: absolute;
        inset: 0;
      }
      #cam .shot { position: absolute; inset: 0; overflow: hidden; }
      #cam .dive, #cam .bg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #cam .fg { position: absolute; }
      #cam .fg img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="57.6"
      data-width="1080"
      data-height="1920"
    >
      <!-- Picture: a still plate per shot with its people on their own layer (parallax), puppet moves, and dives into the next scene -->
      <div id="cam" data-layout-allow-overflow>
        <div id="sh-class0" class="clip shot" data-start="0" data-duration="4.5" data-track-index="0">
          <div id="sh-class0-dive" class="dive">
            <img id="sh-class0-bg" class="bg" src="raw/plates/class0-bg.jpg" alt="" />
            <div id="sh-class0-fg" class="fg" style="left: 236px; top: 473px; width: 745px; height: 478px"><img src="raw/plates/class0-fg.png" alt="" /></div>
          </div>
        </div>
        <div id="sh-slips" class="clip shot" data-start="4.5" data-duration="3.4" data-track-index="0">
          <div id="sh-slips-dive" class="dive">
            <img id="sh-slips-bg" class="bg" src="raw/plates/slips-bg.jpg" alt="" />
          </div>
        </div>
        <div id="sh-gate" class="clip shot" data-start="7.9" data-duration="3.6" data-track-index="0">
          <div id="sh-gate-dive" class="dive">
            <img id="sh-gate-bg" class="bg" src="raw/plates/gate-bg.jpg" alt="" />
            <div id="sh-gate-fg" class="fg" style="left: 478px; top: 1067px; width: 243px; height: 513px"><img src="raw/plates/gate-fg.png" alt="" /></div>
          </div>
        </div>
        <div id="sh-phone" class="clip shot" data-start="11.5" data-duration="9.7" data-track-index="0">
          <div id="sh-phone-dive" class="dive">
            <img id="sh-phone-bg" class="bg" src="raw/plates/phone-bg.jpg" alt="" />
            <div id="sh-phone-fg" class="fg" style="left: 230px; top: 688px; width: 533px; height: 1019px"><img src="raw/plates/phone-body.png" alt="" /><img id="sh-phone-head" src="raw/plates/phone-head.png" alt="" style="transform-origin: 59.5% 34.3%" /></div>
          </div>
        </div>
        <div id="sh-laptop" class="clip shot" data-start="21.2" data-duration="4.4" data-track-index="0">
          <div id="sh-laptop-dive" class="dive">
            <img id="sh-laptop-bg" class="bg" src="raw/plates/laptop-bg.jpg" alt="" />
            <div id="sh-laptop-fg" class="fg" style="left: 85px; top: 635px; width: 995px; height: 820px"><img src="raw/plates/laptop-fg.png" alt="" /></div>
          </div>
        </div>
        <div id="sh-trio" class="clip shot" data-start="25.6" data-duration="7.15" data-track-index="0">
          <div id="sh-trio-dive" class="dive">
            <img id="sh-trio-bg" class="bg" src="raw/plates/trio-bg.jpg" alt="" />
            <div id="sh-trio-fg" class="fg" style="left: 36px; top: 731px; width: 818px; height: 708px"><img src="raw/plates/trio-fg.png" alt="" /></div>
          </div>
        </div>
        <div id="sh-handover" class="clip shot" data-start="32.75" data-duration="4.35" data-track-index="0">
          <div id="sh-handover-dive" class="dive">
            <img id="sh-handover-bg" class="bg" src="raw/plates/handover-bg.jpg" alt="" />
            <div id="sh-handover-fg" class="fg" style="left: 0px; top: 563px; width: 1080px; height: 944px"><img src="raw/plates/handover-fg.png" alt="" /></div>
          </div>
        </div>
        <div id="sh-mobile" class="clip shot" data-start="37.1" data-duration="7.25" data-track-index="0">
          <div id="sh-mobile-dive" class="dive">
            <img id="sh-mobile-bg" class="bg" src="raw/plates/mobile-bg.jpg" alt="" />
          </div>
        </div>
        <div id="sh-kids" class="clip shot" data-start="44.35" data-duration="7.25" data-track-index="0">
          <div id="sh-kids-dive" class="dive">
            <img id="sh-kids-bg" class="bg" src="raw/plates/kids-bg.jpg" alt="" />
            <div id="sh-kids-fg" class="fg" style="left: 328px; top: 1276px; width: 324px; height: 264px"><img src="raw/plates/kids-fg.png" alt="" /></div>
          </div>
        </div>
      </div>

      <!-- Graphics: one scene per beat -->
      <div id="frame" data-composition-id="frame" data-composition-src="compositions/frame.html" data-start="0" data-duration="51.0" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="callouts" data-composition-id="callouts" data-composition-src="compositions/callouts.html" data-start="0" data-duration="51.0" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.6" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="alag" data-composition-id="alag" data-composition-src="compositions/alag.html" data-start="4.5" data-duration="3.45" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="call" data-composition-id="call" data-composition-src="compositions/call.html" data-start="7.9" data-duration="13.35" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="hot" data-composition-id="hot" data-composition-src="compositions/hot.html" data-start="21.2" data-duration="4.45" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="centre" data-composition-id="centre" data-composition-src="compositions/centre.html" data-start="25.6" data-duration="7.2" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="trial" data-composition-id="trial" data-composition-src="compositions/trial.html" data-start="32.75" data-duration="4.4" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="track" data-composition-id="track" data-composition-src="compositions/track.html" data-start="37.1" data-duration="7.3" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="recap" data-composition-id="recap" data-composition-src="compositions/recap.html" data-start="44.35" data-duration="6.7" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="51.0" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="50.75" data-duration="6.85" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>

      <!-- Sound: the original voice, cut at its pauses, plus effects on visible actions -->
      <audio id="sfx-dive-class0" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="4.36" data-duration="0.57" data-track-index="15" data-volume="0.4"></audio>
      <audio id="sfx-dive-slips" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="7.76" data-duration="0.57" data-track-index="16" data-volume="0.4"></audio>
      <audio id="sfx-dive-gate" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="11.36" data-duration="0.57" data-track-index="15" data-volume="0.4"></audio>
      <audio id="sfx-dive-laptop" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="25.46" data-duration="0.57" data-track-index="15" data-volume="0.4"></audio>
      <audio id="sfx-dive-handover" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="36.96" data-duration="0.57" data-track-index="15" data-volume="0.4"></audio>
      <audio id="sfx-dive-mobile" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="44.21" data-duration="0.57" data-track-index="16" data-volume="0.4"></audio>
      <audio id="vo" class="clip" src="raw/vo.m4a" data-start="0" data-duration="56.1" data-track-index="6" data-volume="1"></audio>
      <audio id="sfx-whoosh-end" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="48.53" data-duration="4.0" data-track-index="7" data-volume="0.3" data-fade-out="0.8"></audio>
      <audio id="sfx-pop-3" class="clip" src="assets/sfx/pop.mp3" data-start="3.86" data-duration="0.72" data-track-index="8" data-volume="0.5"></audio>
      <audio id="sfx-pop-hot" class="clip" src="assets/sfx/pop.mp3" data-start="6.41" data-duration="0.72" data-track-index="8" data-volume="0.45"></audio>
      <audio id="sfx-pop-warm" class="clip" src="assets/sfx/click-soft.mp3" data-start="6.81" data-duration="0.37" data-track-index="9" data-volume="0.55"></audio>
      <audio id="sfx-pop-cold" class="clip" src="assets/sfx/pop.mp3" data-start="7.16" data-duration="0.72" data-track-index="8" data-volume="0.45"></audio>
      <audio id="sfx-q1" class="clip" src="assets/sfx/click-soft.mp3" data-start="12.36" data-duration="0.37" data-track-index="8" data-volume="0.5"></audio>
      <audio id="sfx-q2" class="clip" src="assets/sfx/click-soft.mp3" data-start="15.41" data-duration="0.37" data-track-index="8" data-volume="0.5"></audio>
      <audio id="sfx-q3" class="clip" src="assets/sfx/click-soft.mp3" data-start="18.31" data-duration="0.37" data-track-index="8" data-volume="0.5"></audio>
      <audio id="sfx-stamp-hot" class="clip" src="assets/sfx/pop.mp3" data-start="21.31" data-duration="0.72" data-track-index="8" data-volume="0.5"></audio>
      <audio id="sfx-stamp-trial" class="clip" src="assets/sfx/pop.mp3" data-start="35.86" data-duration="0.72" data-track-index="8" data-volume="0.5"></audio>
      <audio id="sfx-adm" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="42.81" data-duration="2.12" data-track-index="8" data-volume="0.55"></audio>
      <audio id="sfx-follow" class="clip" src="assets/sfx/pop.mp3" data-start="55.36" data-duration="0.72" data-track-index="8" data-volume="0.5"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Camera: each shot plays unscaled under a panel that ends exactly at its old card's edge.
      // Punch-ins pivot on that edge, so the card above stays hidden and the characters below stay whole.
      const shots = [
        // [time, scale, x, panel edge px]
        [0, 1.0, 0, 585],
        [2.55, 1.2, 0, 585],
        [4.5, 1.0, 0, 585],
        [7.9, 1.0, 0, 585],
        [11.5, 1.0, 0, 640],
        [12.4, 1.1, 0, 640],
        [15.45, 1.2, 0, 640],
        [18.35, 1.06, 0, 640],
        [21.2, 1.0, 0, 580],
        [23.7, 1.12, 0, 580],
        [25.6, 1.0, 0, 700],
        [28.65, 1.18, 0, 700],
        [32.75, 1.0, 0, 585],
        [35.95, 1.1, 0, 585],
        [37.1, 1.0, 0, 805],
        [41.3, 1.18, 0, 805],
        [44.35, 1.0, 0, 585],
        [47.0, 1.12, 0, 585],
      ];
      shots.forEach(([t, sc, x, edge], i) => {
        const next = i + 1 < shots.length ? shots[i + 1][0] : 51.6;
        tl.set("#cam", { scale: sc, x: x, transformOrigin: "50% " + edge + "px" }, t);
        tl.to("#cam", { scale: sc * 1.035, duration: next - t, ease: "none" }, t);
      });
      tl.fromTo("#sh-class0-fg", { scale: 1, transformOrigin: "304px 112px" }, { scale: 1.055, x: -8, duration: 4.5, ease: "none" }, 0);
      tl.fromTo("#sh-class0-bg", { scale: 1, transformOrigin: "540px 585px" }, { scale: 1.03, duration: 4.5, ease: "none" }, 0);
      tl.to("#sh-class0-dive", { scale: 2.6, transformOrigin: "760px 1050px", duration: 0.4, ease: "power3.in" }, 4.1);
      tl.fromTo("#sh-slips-bg", { scale: 1, transformOrigin: "540px 585px" }, { scale: 1.03, duration: 3.4, ease: "none" }, 4.5);
      tl.fromTo("#sh-slips-dive", { scale: 1.22, transformOrigin: "50% 72%" }, { scale: 1, duration: 0.6, ease: "expo.out" }, 4.5);
      tl.to("#sh-slips-dive", { scale: 2.6, transformOrigin: "930px 900px", duration: 0.4, ease: "power3.in" }, 7.5);
      tl.fromTo("#sh-gate-fg", { scale: 1, transformOrigin: "62px -482px" }, { scale: 1.055, x: -8, duration: 3.6, ease: "none" }, 7.9);
      tl.fromTo("#sh-gate-bg", { scale: 1, transformOrigin: "540px 585px" }, { scale: 1.03, duration: 3.6, ease: "none" }, 7.9);
      tl.fromTo("#sh-gate-dive", { scale: 1.22, transformOrigin: "50% 72%" }, { scale: 1, duration: 0.6, ease: "expo.out" }, 7.9);
      tl.to("#sh-gate-dive", { scale: 2.6, transformOrigin: "720px 1350px", duration: 0.4, ease: "power3.in" }, 11.1);
      tl.fromTo("#sh-phone-fg", { scale: 1, transformOrigin: "310px -48px" }, { scale: 1.055, x: 8, duration: 9.7, ease: "none" }, 11.5);
      tl.fromTo("#sh-phone-bg", { scale: 1, transformOrigin: "540px 640px" }, { scale: 1.03, duration: 9.7, ease: "none" }, 11.5);
      tl.fromTo("#sh-phone-dive", { scale: 1.22, transformOrigin: "50% 72%" }, { scale: 1, duration: 0.6, ease: "expo.out" }, 11.5);
      tl.fromTo("#sh-laptop-fg", { scale: 1, transformOrigin: "455px -55px" }, { scale: 1.055, x: -8, duration: 4.4, ease: "none" }, 21.2);
      tl.fromTo("#sh-laptop-bg", { scale: 1, transformOrigin: "540px 580px" }, { scale: 1.03, duration: 4.4, ease: "none" }, 21.2);
      tl.fromTo("#sh-laptop-dive", { scale: 1.22, transformOrigin: "50% 72%" }, { scale: 1, duration: 0.6, ease: "expo.out" }, 21.2);
      tl.to("#sh-laptop-dive", { scale: 2.6, transformOrigin: "880px 1080px", duration: 0.4, ease: "power3.in" }, 25.2);
      tl.fromTo("#sh-trio-fg", { scale: 1, transformOrigin: "504px -31px" }, { scale: 1.055, x: 8, duration: 7.15, ease: "none" }, 25.6);
      tl.fromTo("#sh-trio-bg", { scale: 1, transformOrigin: "540px 700px" }, { scale: 1.03, duration: 7.15, ease: "none" }, 25.6);
      tl.fromTo("#sh-trio-dive", { scale: 1.22, transformOrigin: "50% 72%" }, { scale: 1, duration: 0.6, ease: "expo.out" }, 25.6);
      tl.fromTo("#sh-handover-fg", { scale: 1, transformOrigin: "540px 22px" }, { scale: 1.055, x: -8, duration: 4.35, ease: "none" }, 32.75);
      tl.fromTo("#sh-handover-bg", { scale: 1, transformOrigin: "540px 585px" }, { scale: 1.03, duration: 4.35, ease: "none" }, 32.75);
      tl.fromTo("#sh-handover-dive", { scale: 1.22, transformOrigin: "50% 72%" }, { scale: 1, duration: 0.6, ease: "expo.out" }, 32.75);
      tl.to("#sh-handover-dive", { scale: 2.6, transformOrigin: "430px 950px", duration: 0.4, ease: "power3.in" }, 36.7);
      tl.fromTo("#sh-mobile-bg", { scale: 1, transformOrigin: "540px 805px" }, { scale: 1.03, duration: 7.25, ease: "none" }, 37.1);
      tl.fromTo("#sh-mobile-dive", { scale: 1.22, transformOrigin: "50% 72%" }, { scale: 1, duration: 0.6, ease: "expo.out" }, 37.1);
      tl.to("#sh-mobile-dive", { scale: 2.6, transformOrigin: "480px 1200px", duration: 0.4, ease: "power3.in" }, 43.95);
      tl.fromTo("#sh-kids-fg", { scale: 1, transformOrigin: "212px -691px" }, { scale: 1.055, x: -8, duration: 7.25, ease: "none" }, 44.35);
      tl.fromTo("#sh-kids-bg", { scale: 1, transformOrigin: "540px 585px" }, { scale: 1.03, duration: 7.25, ease: "none" }, 44.35);
      tl.fromTo("#sh-kids-dive", { scale: 1.22, transformOrigin: "50% 72%" }, { scale: 1, duration: 0.6, ease: "expo.out" }, 44.35);
      // puppets: the teacher nods as he asks each question and talks between them
      [12.4, 15.45, 18.35].forEach((t) => {
        tl.to("#sh-phone-head", { rotation: -6, duration: 0.16, ease: "power2.out" }, t);
        tl.to("#sh-phone-head", { rotation: 3, duration: 0.2, ease: "power2.inOut" }, t + 0.16);
        tl.to("#sh-phone-head", { rotation: 0, duration: 0.25, ease: "power2.out" }, t + 0.36);
        for (let s = t + 0.65, j = 0; s < t + 2.4; s += 0.26, j++) tl.to("#sh-phone-head", { rotation: j % 2 ? 2 : -2, y: j % 2 ? 0 : -3, duration: 0.26, ease: "sine.inOut" }, s);
        tl.to("#sh-phone-head", { rotation: 0, y: 0, duration: 0.2 }, t + 2.5);
      });
      // the man at the gate and the trio sway; the teacher at the laptop types; the kids walk to the door
      for (let s = 7.95, j = 0; s < 11.2; s += 0.9, j++) tl.to("#sh-gate-fg img", { rotation: j % 2 ? 1.4 : -1.4, transformOrigin: "50% 100%", duration: 0.9, ease: "sine.inOut" }, s);
      for (let s = 25.7, j = 0; s < 32.4; s += 1.2, j++) tl.to("#sh-trio-fg img", { rotation: j % 2 ? 0.8 : -0.8, transformOrigin: "50% 100%", duration: 1.2, ease: "sine.inOut" }, s);
      for (let s = 21.3, j = 0; s < 25.1; s += 0.18, j++) tl.to("#sh-laptop-fg img", { y: j % 2 ? 0 : -4, duration: 0.18, ease: "sine.inOut" }, s);
      tl.fromTo("#sh-kids-fg img", { x: 0, y: 0 }, { x: 70, y: -46, duration: 7.0, ease: "none" }, 44.4);
      for (let s = 44.4, j = 0; s < 51.3; s += 0.22, j++) tl.to("#sh-kids-fg", { y: j % 2 ? 0 : -5, duration: 0.22, ease: "sine.inOut" }, s);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
