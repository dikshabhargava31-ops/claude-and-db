  <script>
    window.__timelines = window.__timelines || {};
    const T0 = 25.3;
    const g = (t) => +(t - T0).toFixed(3);

    const markIn = (sel, t) => tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, g(t));
    const draw = (sel, t, d) => tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d || 0.45, ease: "power2.inOut" }, g(t));
    const stamp = (sel, t, rot) => tl.fromTo(sel, { opacity: 0, scale: 2.2, rotation: rot - 10 }, { opacity: 0.92, scale: 1, rotation: rot, duration: 0.28, ease: "power4.in" }, g(t));
    // cutout puppets: enter, nod, hop, sway
    const enter = (id, t, dx, dy) => tl.fromTo("#" + id, { x: dx || 0, y: dy === undefined ? 500 : dy, rotation: dx ? (dx > 0 ? 10 : -10) : 0 }, { x: 0, y: 0, rotation: 0, duration: 0.55, ease: "back.out(1.5)" }, g(t));
    const nod = (id, t, amp) => { amp = amp || 7; tl.to("#" + id + "-head", { rotation: -amp, duration: 0.16, ease: "power2.out" }, g(t)); tl.to("#" + id + "-head", { rotation: amp * 0.55, duration: 0.2, ease: "power2.inOut" }, g(t) + 0.16); tl.to("#" + id + "-head", { rotation: 0, duration: 0.28, ease: "power2.out" }, g(t) + 0.36); };
    const hop = (id, t, n) => { for (let k = 0; k < (n || 1); k++) { const s = g(t) + k * 0.42; tl.to("#" + id + "-in", { y: -46, scaleY: 1.04, duration: 0.18, ease: "power2.out" }, s); tl.to("#" + id + "-in", { y: 0, scaleY: 0.94, duration: 0.15, ease: "power2.in" }, s + 0.18); tl.to("#" + id + "-in", { scaleY: 1, duration: 0.09, ease: "power1.out" }, s + 0.33); } };
    const sway = (id, t0, t1, amp, per) => { per = per || 1.3; let s = g(t0), dir = 1; while (s + per <= g(t1)) { tl.to("#" + id + "-in", { rotation: amp * dir, duration: per, ease: "sine.inOut" }, s); s += per; dir = -dir; } tl.to("#" + id + "-in", { rotation: 0, duration: 0.4, ease: "sine.out" }, s); };
    const talk = (id, t0, t1) => { let s = g(t0), k = 0; while (s + 0.26 <= g(t1)) { tl.to("#" + id + "-head", { rotation: k % 2 ? 2.5 : -2.5, y: k % 2 ? 0 : -3, duration: 0.26, ease: "sine.inOut" }, s); s += 0.26; k++; } tl.to("#" + id + "-head", { rotation: 0, y: 0, duration: 0.2 }, s); };

    });
