<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Second Brain</title>
  <meta name="description" content="A personal dashboard for goals, projects, tasks, notes, resources, books, habits, journal and focus. Everything is saved in this browser.">
  <meta name="theme-color" content="#fbf7f4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
  <symbol id="i-tick" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H5zM19 4h-4a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h4z"/></symbol>
</svg>

<aside class="side" id="side">
  <div class="brand"><span>🧠</span><b>my second brain</b></div>
  <div class="cap">
    <button class="btn pri sm" type="button" data-act="capture">＋ quick capture</button>
    <button class="btn sm" type="button" data-act="search" aria-label="Search"><svg class="i"><use href="#i-search"/></svg></button>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot">
    <div class="nav">
      <a href="#" data-act="reminders"><span class="e">⏰</span>reminders<small id="remCount"></small></a>
      <a href="#" data-act="settings"><span class="e">⚙️</span>settings &amp; backup</a>
    </div>
    <div class="mini-timer" id="miniTimer" data-act="go" data-to="focus" hidden>⏱ <b id="miniClock">25:00</b> <span id="miniLabel">focus</span></div>
    <div class="hint">N quick capture · / search</div>
  </div>
</aside>
<div class="scrim" data-act="drawer"></div>

<main>
  <div class="topbar">
    <button class="ib" type="button" data-act="drawer" aria-label="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
    <b id="topTitle">my second brain</b>
    <button class="ib" type="button" data-act="search" aria-label="Search"><svg class="i"><use href="#i-search"/></svg></button>
    <button class="ib" type="button" data-act="reminders" aria-label="Reminders"><svg class="i"><use href="#i-bell"/></svg></button>
  </div>
  <div class="page" id="page"></div>
</main>

<nav class="bottombar" id="bottombar">
  <a href="#/" data-r=""><svg class="i"><use href="#i-home"/></svg>home</a>
  <a href="#/tasks" data-r="tasks"><svg class="i"><use href="#i-check"/></svg>tasks</a>
  <button type="button" class="fab" data-act="capture" aria-label="Quick capture"><span><svg class="i"><use href="#i-plus"/></svg></span></button>
  <a href="#/notes" data-r="notes"><svg class="i"><use href="#i-note"/></svg>notes</a>
  <a href="#/library" data-r="library"><svg class="i"><use href="#i-book"/></svg>library</a>
</nav>

<dialog class="modal" id="modal"></dialog>
<div class="toast" id="toast" hidden></div>
<div class="tip" id="tip" hidden></div>

<script src="app.js"></script>
</body>
</html>
